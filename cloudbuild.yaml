# Publishes the admin panel to Artifact Registry, and optionally rolls this lab's
# own panel onto what it published.
#
# Publishing is what this file is for; deploying is opt-in behind _DEPLOY and off
# by default. See the substitution's comment for why it has to be, and
# docs/deploying-from-a-pipeline.md for the credential the deploy uses.
#
# Provisioned and fired by terraform/gcp: the trigger watches tags matching
# ^admin-v.*$ and supplies _IMAGE_BASE, _REGION, and _TAG (the tag that fired it).
# Everything is addressed by an immutable version derived from that tag — nothing
# here writes `latest`, because a chart that pulls a moving name cannot say which
# build is running.
#
# To exercise the pipeline without cutting a release, naming the same service
# account the trigger uses so the manual path exercises the real one:
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_IMAGE_BASE=REGION-docker.pkg.dev/PROJECT/home-lab,_TAG=dev-local \
#     --service-account=projects/PROJECT/serviceAccounts/home-lab-build@PROJECT.iam.gserviceaccount.com .
#
# It publishes the images and the chart as 0.0.0-<tag>, which sorts below every
# real release.
#
# Images and chart carry ONE version, which is the release tag with the admin-v
# prefix stripped -- admin-v1.4.0 publishes 1.4.0 everywhere. That is what lets
# the chart default admin.image.tag to its own appVersion instead of a values
# file repeating the number three times.

substitutions:
  # Registry prefix, e.g. us-west1-docker.pkg.dev/PROJECT/home-lab. Supplied by
  # the trigger; empty here so a misconfigured manual build fails on the guard
  # below rather than pushing somewhere unintended.
  _IMAGE_BASE: ''
  _REGION: us-west1
  _TAG: dev-local

  # Roll the lab's own panel onto what this build just published.
  #
  # Off unless set to "true", and that gate is not a convenience. This deploys by
  # calling an endpoint the panel serves, so the panel already running has to be a
  # version that has one — which the build introducing it, by definition, is not.
  # Publish first, upgrade by hand once, then turn this on.
  #
  # It is also the honest default for a public repository: a fork that cuts a tag
  # should publish artifacts and touch nobody's cluster.
  _DEPLOY: ''
  # The panel that gets upgraded, and the deployment inside it. The id is in the
  # URL of the deployment's page, and the panel's own page shows the whole request.
  _PANEL_URL: 'https://eetr01.eetr.app'
  _CHART_ID: ''
  # A Secret Manager secret holding one eetr-auth API key (eak_…). Read by the
  # deploy step itself rather than declared in availableSecrets, so a build that
  # is not deploying never needs the secret to exist or the builder to reach it.
  _API_KEY_SECRET: admin-pipeline-api-key

options:
  machineType: E2_HIGHCPU_8
  # Required when the build runs as a user-specified service account: it has no
  # default bucket to write to, so the destination has to be named.
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: check-substitutions
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ -z "${_IMAGE_BASE}" ]; then
          echo "_IMAGE_BASE is empty. Pass it, or let the trigger supply it." >&2
          exit 1
        fi

        # The one place the release tag becomes a version, written to the shared
        # workspace so every step below reads the same answer. It used to be
        # computed inside publish-chart, which was fine while only the chart used
        # it; the images carry it now too, and three copies of a case statement is
        # three chances for the chart and the images it references to disagree
        # about what a release is called.
        tag="${_TAG}"
        case "$${tag}" in
          admin-v*) version="$${tag#admin-v}" ;;
          # A manual submit passes something like dev-local, which is not a
          # version. Publish it as a prerelease of 0.0.0 so it sorts below every
          # real release and can never be mistaken for one.
          *)        version="0.0.0-$${tag}" ;;
        esac

        printf '%s' "$${version}" > /workspace/version
        echo "Publishing admin-api, admin-web, admin-agent and the chart at $${version}"

  - id: build-admin-api
    name: gcr.io/cloud-builders/docker
    waitFor: ['check-substitutions']
    entrypoint: bash
    env:
      # The Dockerfile uses RUN --mount=type=cache, which the classic builder
      # does not understand.
      - DOCKER_BUILDKIT=1
    args:
      - -c
      - |
        set -euo pipefail
        version=$$(cat /workspace/version)
        # The module directory is the context: it is self-contained, and a
        # repository-root context would ship every chart and playbook to the daemon.
        docker build \
          --tag "${_IMAGE_BASE}/admin-api:$${version}" \
          --file admin/api/Dockerfile \
          admin/api
        docker push "${_IMAGE_BASE}/admin-api:$${version}"

  # Built in parallel with the API rather than after it: neither reads the other's
  # output, and the panel's npm install is the long pole of the two.
  - id: build-admin-web
    name: gcr.io/cloud-builders/docker
    waitFor: ['check-substitutions']
    entrypoint: bash
    env:
      # The Dockerfile uses RUN --mount=type=cache, which the classic builder
      # does not understand.
      - DOCKER_BUILDKIT=1
    args:
      - -c
      - |
        set -euo pipefail
        version=$$(cat /workspace/version)
        docker build \
          --tag "${_IMAGE_BASE}/admin-web:$${version}" \
          --file admin/web/Dockerfile \
          admin/web
        docker push "${_IMAGE_BASE}/admin-web:$${version}"

  # Also in parallel. It compiles nothing — its Go binary is copied out of a
  # published Octo image — so it is the quickest of the three and waits on nobody.
  - id: build-admin-agent
    name: gcr.io/cloud-builders/docker
    waitFor: ['check-substitutions']
    entrypoint: bash
    env:
      # The Dockerfile opens with a `# syntax=` directive, which pins a frontend
      # the classic builder does not read at all.
      - DOCKER_BUILDKIT=1
    args:
      - -c
      - |
        set -euo pipefail
        version=$$(cat /workspace/version)
        # The module directory is the context. It holds the definition and the
        # skills, which are copied into the image beside the runtime binary — so the
        # image tag names the prompt and the tool set as well as the runtime.
        docker build \
          --tag "${_IMAGE_BASE}/admin-agent:$${version}" \
          --file admin/agent/Dockerfile \
          admin/agent
        docker push "${_IMAGE_BASE}/admin-agent:$${version}"

  # The chart is published as an OCI artifact into the same repository as the
  # images, which is what lets one `helm upgrade` reference one place.
  #
  # Its version comes from the release tag rather than from Chart.yaml, even
  # though release-please now keeps Chart.yaml in step with the release too. The
  # two agree on a release commit, and passing it here as well means a manual
  # submit -- which is not a release and has no matching Chart.yaml -- still
  # publishes a chart whose appVersion names the images this build pushed.
  - id: publish-chart
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    # Independent of the image build, so it does not wait on it.
    waitFor: ['check-substitutions']
    args:
      - -c
      - |
        set -euo pipefail

        # Pinned. Piping get-helm-3 from main would let the version change with no
        # commit here, and how Helm packages a chart is exactly what this relies on.
        helm_version=v4.1.1
        curl -fsSL "https://get.helm.sh/helm-$${helm_version}-linux-amd64.tar.gz"           | tar -xz -C /tmp linux-amd64/helm
        install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
        helm version --short

        version=$$(cat /workspace/version)

        helm registry login         --username oauth2accesstoken           --password "$(gcloud auth print-access-token)"           "${_REGION}-docker.pkg.dev"

        mkdir -p dist
        helm package charts/admin           --version "$${version}"           --app-version "$${version}"           --destination dist
        helm push "dist/home-lab-admin-$${version}.tgz" "oci://${_IMAGE_BASE}"

  # Roll the lab's own panel onto this build, through the panel itself.
  #
  # The credential is an eetr-auth API key, and the panel exchanges it for a token
  # before calling its API — so this build holds one opaque secret and the admin
  # API stays unroutable. docs/deploying-from-a-pipeline.md is the long version.
  #
  # Accepted, not done: the answer names a Kubernetes Job that then runs Helm,
  # which waits for pods far longer than any build should hold a connection open.
  # This step asserts the request was accepted and stops there; whether the
  # release came up is read from the panel.
  - id: deploy-panel
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    # Every one of them, because this asks the cluster to pull what they pushed:
    # each build step pushes its own image, and the chart references all three.
    waitFor:
      - 'build-admin-api'
      - 'build-admin-web'
      - 'build-admin-agent'
      - 'publish-chart'
    args:
      - -c
      - |
        set -euo pipefail

        if [ "${_DEPLOY}" != "true" ]; then
          echo "_DEPLOY is not true — published only, nothing was upgraded."
          exit 0
        fi

        if [ -z "${_CHART_ID}" ]; then
          echo "_DEPLOY is set but _CHART_ID is empty. It is the deployment id in the panel's URL." >&2
          exit 1
        fi

        # The same answer check-substitutions wrote, so the version deployed is the
        # version published rather than a second reading of the tag.
        version=$$(cat /workspace/version)

        # Read here rather than through availableSecrets so a build with _DEPLOY
        # unset never touches Secret Manager at all. Never echoed.
        api_key="$(gcloud secrets versions access latest --secret="${_API_KEY_SECRET}")"

        echo "Rolling ${_CHART_ID} onto $${version} at ${_PANEL_URL}"

        # Status and body both, because every refusal here answers with JSON too
        # and the body alone cannot tell an accepted deploy from a rejected one.
        # The body goes to a file rather than being split off the end of stdout:
        # it keeps the status a single clean value and this script free of the
        # dollar-quoting that Cloud Build's own substitution pass would eat.
        status="$$(curl -sS -o /tmp/deploy-body -w '%{http_code}' -X PATCH \
          "${_PANEL_URL}/api/v1/charts/${_CHART_ID}" \
          -H "Authorization: Bearer $${api_key}" \
          -H 'Content-Type: application/json' \
          -d "{\"chartVersion\":\"$${version}\"}")"
        body="$$(cat /tmp/deploy-body)"

        case "$${status}" in
          202) echo "accepted: $${body}" ;;
          # Somebody or something else is mid-deploy. Distinct from a refusal
          # because retrying this later is right, where retrying a 400 never is.
          409) echo "another operation holds this release: $${body}" >&2; exit 75 ;;
          *)   echo "the deploy was refused ($${status}): $${body}" >&2; exit 1 ;;
        esac

# There is deliberately no `images:` block. It names images literally, and these
# are tagged with a version computed at build time, which it cannot express. Each
# build step pushes its own image instead. The cost is that the build's result no
# longer lists them as artifacts; the registry is the record either way.
#
# It also happens to be what makes the deploy step above possible: that list is
# pushed only after every step finishes, so a deploy gated behind it would ask the
# cluster to pull tags that did not exist yet.
