name: home-lab-postgres

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER in databases/.env}
      POSTGRES_DB: ${POSTGRES_DATABASE:?set POSTGRES_DATABASE in databases/.env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
    ports:
      - "127.0.0.1:5432:5432"
      - "${DATABASE_LAN_ADDRESS:?set DATABASE_LAN_ADDRESS in databases/.env}:5432:5432"
    secrets:
      - postgres_admin_password
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/initdb/001-extensions.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  postgres_admin_password:
    file: ${DATABASE_SECRETS_DIR:?set DATABASE_SECRETS_DIR in databases/.env}/postgres_admin_password

volumes:
  postgres-data:
    name: home-lab-postgres-data
