{{- /*
  additionalDomains is checked here, before anything renders, because every
  mistake it can hold is one the API server reports against the Gateway rather
  than against the values file that caused it.

  Duplicate names collide once the hostname index is appended: listener names
  must be unique within a Gateway, and the CEL rule enforcing that rejects the
  whole object, so one repeated name takes the working listeners down with it.
  A hostname repeated across entries is the worse version of the same thing --
  two HTTPS listeners identical but for the certificate they point at, which
  resolves to whichever the implementation happens to pick.

  Sixty-two is 64 minus the two listeners above: `listeners` is capped at 64 by
  the CRD, and a Gateway over the cap is rejected in full rather than truncated.
*/ -}}
{{- $seenNames := list }}
{{- $seenHostnames := list }}
{{- range $domain := .Values.platform.gateway.additionalDomains }}
{{- $name := required "platform.gateway.additionalDomains[].name is required -- it prefixes the listener names" $domain.name }}
{{- if has $name $seenNames }}
{{- fail (printf "platform.gateway.additionalDomains has two entries named %s, and listener names must be unique within a Gateway" $name) }}
{{- end }}
{{- $seenNames = append $seenNames $name }}
{{- range $hostname := $domain.hostnames }}
{{- if has $hostname $seenHostnames }}
{{- fail (printf "platform.gateway.additionalDomains serves %s more than once, and two listeners for one hostname differ only in the certificate they present" $hostname) }}
{{- end }}
{{- $seenHostnames = append $seenHostnames $hostname }}
{{- end }}
{{- end }}
{{- if gt (len $seenHostnames) 62 }}
{{- fail (printf "platform.gateway.additionalDomains asks for %d listeners on top of the two for baseDomain, and a Gateway holds at most 64" (len $seenHostnames)) }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.platform.gateway.className }}
  labels:
    {{- include "home-lab-platform.labels" . | nindent 4 }}
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.platform.gateway.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "home-lab-platform.labels" . | nindent 4 }}
  {{- if .Values.platform.issuers.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
  {{- end }}
spec:
  gatewayClassName: {{ .Values.platform.gateway.className }}
  listeners:
    - name: web
      port: 8000
      protocol: HTTP
      hostname: {{ printf "*.%s" .Values.platform.baseDomain | quote }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              {{ .Values.platform.gateway.routeNamespaceLabel.key }}: {{ .Values.platform.gateway.routeNamespaceLabel.value | quote }}
    - name: websecure
      port: 8443
      protocol: HTTPS
      hostname: {{ printf "*.%s" .Values.platform.baseDomain | quote }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              {{ .Values.platform.gateway.routeNamespaceLabel.key }}: {{ .Values.platform.gateway.routeNamespaceLabel.value | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.platform.gateway.tlsSecretName }}
    {{- /*
      Domains other than baseDomain served by this same Gateway. Each entry is
      one application's public names and the Secret its certificate lands in:
      the listeners below reference that Secret, and cert-manager's Gateway shim
      — the annotation above is what enables it — issues one Certificate per
      Secret carrying every name that references it. So a two-hostname entry is
      one certificate with two SANs, not two certificates racing over one Secret.

      HTTPS only, deliberately. The `web` listener above exists for baseDomain
      because it predates the tunnel; nothing reaches this cluster except through
      cloudflared, which speaks HTTPS to the Traefik Service, so a plaintext
      listener for a new domain would be an entrypoint with no caller.

      The DNS-01 solver has to be able to edit each of these zones. A token
      scoped to one zone silently leaves the certificate Pending — check the
      Certificate's status, not the Gateway's, when a new domain serves nothing.
    */}}
    {{- range $domain := .Values.platform.gateway.additionalDomains }}
    {{- range $index, $hostname := $domain.hostnames }}
    - name: {{ printf "%s-%d" (required "platform.gateway.additionalDomains[].name is required — it prefixes the listener names" $domain.name) $index }}
      port: 8443
      protocol: HTTPS
      hostname: {{ $hostname | quote }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              {{ $.Values.platform.gateway.routeNamespaceLabel.key }}: {{ $.Values.platform.gateway.routeNamespaceLabel.value | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ required "platform.gateway.additionalDomains[].tlsSecretName is required — it is the Secret cert-manager writes the certificate into" $domain.tlsSecretName }}
    {{- end }}
    {{- end }}
