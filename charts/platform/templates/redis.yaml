{{- if .Values.platform.redis.enabled }}
{{- /*
  Bound once, with a message, because the schema is not the only way in:
  `--skip-schema-validation` renders straight past it, and a nil passwordSecret
  then fails as "nil pointer evaluating interface {}.name" against a line number
  in this file. That names the symptom and not the value, which is the kind of
  error this repository spends comments avoiding.
*/}}
{{- $redisSecret := required "platform.redis.passwordSecret is required when Redis is enabled" .Values.platform.redis.passwordSecret }}
# Redis, as a coordination point for things that cannot be coordinated in one
# process.
#
# It exists because a Deployment with more than one replica cannot hold a lock in
# a variable. The first caller is the admin panel's token refresh: eetr-auth
# rotates refresh tokens with OAuth 2.1 reuse detection, so two replicas
# presenting the same one cascade-revokes the family and signs the operator out
# everywhere. The panel deduplicates that per process today, which is exactly as
# far as one process reaches.
#
# ONE REPLICA, AND THAT IS NOT A GAP. A lock has to have a single authority: a
# second Redis is not more availability, it is a second answer to a question that
# must have exactly one. Replication here would make the failure it is meant to
# prevent possible again, on a split brain rather than on a race. What it buys is
# that the panel's replicas agree with each other; what it costs is that Redis
# restarting drops the agreement, which is why nothing may keep anything here it
# cannot lose.
#
# NO PERSISTENCE for the same reason. Save and appendonly are both off, so a
# restart is an empty cache rather than a slow replay of state that has since
# gone stale. Anything durable belongs in PostgreSQL, which is not in this
# cluster; see databases/README.md.
#
# The one exception is WHO may connect. The ACL users apps authenticate as are
# created from the admin panel and live in an aclfile on a small claim, because a
# user that vanished on every restart would be an app that stopped authenticating
# on every restart. Keys still go; users stay. The file holds only SHA-256 hashes
# of passwords, which is the form Redis stores them in anyway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: redis
    {{- include "home-lab-platform.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate rather than RollingUpdate, and load-bearing: the default briefly runs
  # two pods behind one Service, so a lock taken from one would not be seen by the
  # other. A few seconds with no Redis is the honest failure; two Redises is not.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: home-lab-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        # The aclfile claim is the one volume here that must be writable, and a
        # freshly provisioned one can come up owned by root. fsGroup makes it
        # group-owned by Redis's group, so the start script's first `touch` works
        # instead of failing under `set -eu` before redis-server ever starts.
        # OnRootMismatch, so a restart does not re-walk the volume each time.
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ printf "%s:%s" .Values.platform.redis.image.repository .Values.platform.redis.image.tag | quote }}
          imagePullPolicy: {{ .Values.platform.redis.image.pullPolicy }}
          # The default user's password lives in the aclfile, not on the command
          # line: redis.conf is explicit that `requirepass` is ignored once an
          # aclfile is in use, so the two cannot be combined. On every start the
          # default user's line is rewritten from the Secret, hashed, and put
          # first, keeping every other line as it was. That way rotating the
          # Secret and restarting the pod is still how the password changes, and
          # the plaintext is never written anywhere.
          #
          # The line grants everything on purpose. The default user is the
          # platform's own credential, the one the admin panel and its refresh
          # lock connect with; app users get their narrower ones from the panel.
          #
          # `exec` so redis-server is PID 1 and receives SIGTERM directly; without
          # it the shell holds the signal and the pod waits out its grace period on
          # every rollout.
          command:
            - sh
            - -c
            - |
              set -eu
              acl=/acl/users.acl
              hash=$(printf '%s' "$REDIS_PASSWORD" | sha256sum | cut -d' ' -f1)
              touch "$acl"
              others=$(grep -v '^user default ' "$acl" || true)
              {
                printf 'user default on #%s ~* &* +@all\n' "$hash"
                if [ -n "$others" ]; then printf '%s\n' "$others"; fi
              } > "$acl.next"
              mv "$acl.next" "$acl"
              exec redis-server \
                --aclfile "$acl" \
                --save "" \
                --appendonly no \
                --maxmemory {{ .Values.platform.redis.maxmemory | quote }} \
                --maxmemory-policy noeviction
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "platform.redis.passwordSecret.name is required" $redisSecret.name }}
                  key: {{ required "platform.redis.passwordSecret.key is required" $redisSecret.key }}
          ports:
            - name: redis
              containerPort: 6379
          # A TCP probe would pass on a Redis that is listening and refusing every
          # command. PING authenticates first, so this fails when the password the
          # clients will use is not the password the server took.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.platform.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          # Nothing is written to /data — persistence is off — but redis-server
          # chdirs into its working directory at startup and fails on a read-only
          # root. /acl is the only thing that outlives the pod.
          volumeMounts:
            - name: data
              mountPath: /data
            - name: acl
              mountPath: /acl
      volumes:
        - name: data
          emptyDir: {}
        - name: acl
          persistentVolumeClaim:
            claimName: redis-acl
---
# Where the ACL users live, and nothing else.
#
# Tiny on purpose: a line per user. One writer is guaranteed by the Deployment
# above — one replica and Recreate — so the access mode does not have to.
#
# Kept on uninstall. Uninstalling the platform chart to reinstall it is a normal
# thing to do here, and having every app lose its credential as a side effect is
# not what anyone means by it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-acl
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: redis
    {{- include "home-lab-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.platform.redis.acl.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.platform.redis.acl.size | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: redis
    {{- include "home-lab-platform.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Who may reach it.
#
# A password is authentication and this is authorization, and the second is worth
# having separately: a credential that leaks is spent from wherever the leak is,
# and this says that "wherever" has to be a namespace an operator labelled on
# purpose. It follows the Gateway's pattern deliberately — the same shape, so
# there is one idea to learn rather than two.
#
# Selecting a namespace rather than a pod: the consumers are in other namespaces,
# where a podSelector in this policy cannot see them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: redis
    {{- include "home-lab-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  # Ingress only. Egress is left alone because this pod makes no outbound
  # connections of its own, so a rule would describe traffic that does not exist.
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.platform.redis.clientNamespaceLabel.key }}: {{ .Values.platform.redis.clientNamespaceLabel.value | quote }}
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
