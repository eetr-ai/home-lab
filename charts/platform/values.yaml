platform:
  baseDomain: example.invalid
  acmeEmail: operator@example.invalid

  gateway:
    name: home-lab
    className: traefik
    tlsSecretName: home-lab-wildcard-tls
    routeNamespaceLabel:
      key: home-lab.example/gateway-access
      value: "true"

  issuers:
    enabled: false
    cloudflareApiTokenSecret:
      name: cloudflare-api-token
      key: api-token

  cloudflared:
    enabled: false
    replicas: 2
    image:
      repository: cloudflare/cloudflared
      tag: 2026.8.2
      pullPolicy: IfNotPresent
    tunnelTokenSecret:
      name: cloudflared-token
      key: token
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

  whoami:
    enabled: false
    hostname: whoami.example.invalid
    image:
      repository: traefik/whoami
      tag: v1.12.0
      pullPolicy: IfNotPresent

traefik:
  fullnameOverride: traefik
  deployment:
    replicas: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  ingressRoute:
    dashboard:
      enabled: false
  providers:
    kubernetesCRD:
      enabled: false
    kubernetesIngress:
      enabled: false
    kubernetesGateway:
      enabled: true
      experimentalChannel: false
  gateway:
    enabled: false
  gatewayClass:
    enabled: false
  service:
    spec:
      type: ClusterIP
  ports:
    web:
      expose:
        default: true
      exposedPort: 80
    websecure:
      expose:
        default: true
      exposedPort: 443
  api:
    dashboard: false

cert-manager:
  fullnameOverride: cert-manager
  crds:
    enabled: true
    keep: true
  config:
    gatewayAPI:
      enabled: true
  prometheus:
    enabled: false

nfs-provisioner:
  fullnameOverride: nfs-subdir-external-provisioner
  nfs:
    server: 192.0.2.1
    path: /export/kubernetes
    mountOptions:
      - nfsvers=4.1
  storageClass:
    create: true
    defaultClass: true
    name: nfs-client
    provisionerName: home-lab.example/nfs-subdir
    reclaimPolicy: Delete
    archiveOnDelete: false
    onDelete: delete
    allowVolumeExpansion: true

metrics-server:
  # Serves metrics.k8s.io, which is where the admin panel's dashboard reads live
  # CPU and memory from. Set to false on a cluster that already has one — k3s
  # bundles it — since two aggregated API servers cannot both back the same group.
  enabled: true
  fullnameOverride: metrics-server
  # One replica: this is a dashboard input, not something the cluster's own
  # scheduling depends on, and a gap in it costs a blank tile.
  replicas: 1
  args:
    # The kubelets here serve their metrics endpoint with a self-signed
    # certificate that no cluster CA issued, which is the norm for a kubeadm or
    # k3s node and the reason a default install reports every node as unreachable.
    - --kubelet-insecure-tls
    - --kubelet-preferred-address-types=InternalIP,Hostname,ExternalIP
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 192Mi
