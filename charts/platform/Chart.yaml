apiVersion: v2
name: home-lab-platform
description: Cluster platform services for the eetr home lab
type: application
version: 0.1.0
appVersion: "1.0"
dependencies:
  - name: traefik
    version: 41.3.0
    repository: https://traefik.github.io/charts
  - name: cert-manager
    alias: cert-manager
    version: 1.21.1
    repository: oci://quay.io/jetstack/charts
  - name: nfs-subdir-external-provisioner
    alias: nfs-provisioner
    version: 4.0.18
    repository: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
  # Live CPU and memory for the admin panel's dashboard. Nothing else in the
  # cluster depends on it, so it is conditional: without it the panel reports
  # capacity and requests and shows usage as unavailable.
  #
  # k3s ships a metrics-server of its own. On such a cluster set
  # metrics-server.enabled to false rather than installing a second one.
  - name: metrics-server
    version: 3.13.0
    repository: https://kubernetes-sigs.github.io/metrics-server/
    condition: metrics-server.enabled
