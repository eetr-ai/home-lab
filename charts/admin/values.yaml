# Placeholders are deliberately RFC-invalid, so a values file that was copied but
# never edited fails obviously rather than resolving to somebody's real host.
# scripts/install-admin.sh refuses to install while they are still present.

admin:
  # Per-namespace pull secrets, for a cluster whose nodes do not already hold the
  # registry credential.
  #
  # Empty by default because the nodes do hold it: ansible/roles/registry_credentials
  # writes it to the kubelet, so every namespace can pull without a copy of its own.
  # Set this only to override that for one release — a Secret named here must exist
  # in the release namespace, and the installer checks before Helm runs.
  imagePullSecrets: []

  # The Gateway the platform chart owns. A route only attaches when this
  # namespace carries the gateway-access label; the installer applies it.
  gateway:
    name: home-lab

  api:
    # Which identity provider's tokens the API accepts.
    #
    # The issuer is kept exactly as configured, trailing slash and all: it is an
    # identifier rather than a path, and normalizing it would silently fail every
    # issuer check against a provider whose own is spelled with one.
    #
    # The audience is the value a token must name in `aud`, and it is what stops a
    # token minted for another application being replayed here. eetr-auth puts the
    # client id there when no resource indicator is requested, so this is normally
    # the admin panel's client id. It is not a secret — it travels in every
    # authorization request — so it lives in values rather than a Secret.
    oidc:
      issuer: https://auth.example.invalid
      audience: ""

    # The managed services. Each is served only when configured, so a panel with
    # no MongoDB answers 404 for those routes rather than pretending.
    #
    # Both connection strings carry a superuser password, so they come from
    # Secrets created outside Helm — a values file holding one would end up in Git.
    # The installer verifies each Secret exists before Helm runs.
    # Reading the cluster needs no connection string: in the cluster the pod's own
    # ServiceAccount is the credential. On by default for that reason, and the
    # read-only ClusterRole below is created with it.
    kubernetes:
      enabled: true
      # Node disk usage, read from each kubelet's stats endpoint.
      #
      # Off by default, and it is the one grant here worth a deliberate decision.
      # Disk usage is not in the Kubernetes API and metrics-server reports only CPU
      # and memory, so the only source is the kubelet — which means `get` on the
      # nodes/proxy subresource, and that also opens the kubelet's other read
      # endpoints, including the one that serves files under /var/log on the host.
      #
      # Left off, the panel reports every other node figure and shows the node's
      # allocatable ephemeral storage in place of a usage reading, labelled as the
      # scheduling ceiling it is. Nothing else changes.
      nodeStats:
        enabled: false

    # The superuser the panel administers the server as. It also runs the
    # read-only query console — there is no second credential, so access to the
    # panel is access to whatever that account can do, up to and including the
    # container the server runs in. databases/README.md says what that means.
    postgres:
      enabled: false
      secret:
        name: admin-postgres
        key: dsn
    mongo:
      enabled: false
      secret:
        name: admin-mongo
        key: uri

    image:
      repository: registry.example.invalid/home-lab/admin-api
      tag: "0.0.0"
      pullPolicy: IfNotPresent

    # Two, because this is the one service here that can actually take it.
    #
    # The API holds no state: every request carries the operator's bearer token,
    # the Kubernetes reads go through the pod's own ServiceAccount, and the
    # database connections are per-request. There is nothing in a process that a
    # second process would disagree with, so a request arriving mid-rollout is
    # served by whichever replica is ready.
    #
    # This is availability rather than throughput — a panel one operator uses is
    # not short of capacity. What two replicas buy is that a node drained for
    # maintenance, or a pod OOM-killed, does not take the panel's API with it. The
    # PodDisruptionBudget beside this covers the first of those; nothing covers the
    # second, which is why the number is 2 and not 1.
    replicas: 2

    # Sized for a panel one operator uses, not for throughput. Per replica, so the
    # count above multiplies these.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

    # Reaching the API from outside the cluster, for a caller that is not the
    # panel's own browser session. Disabled until something needs it: the agent
    # that will call the API directly is not built yet, and an administrative
    # endpoint should not be publicly routable before it has a reason to be.
    #
    # Enabling it means putting Cloudflare Access in front of the hostname first.
    route:
      enabled: false
      hostname: admin-api.example.invalid

  # The panel itself: the browser-facing half, and an OIDC client of eetr-auth.
  web:
    # The hostname the panel is served on. Also the base of the redirect URI that
    # must be registered with eetr-auth, as https://<hostname>/api/auth/callback/eetr,
    # and eetr-auth matches it exactly — no wildcards.
    #
    # Put Cloudflare Access in front of it before pointing DNS here.
    hostname: admin.example.invalid

    # The confidential client registered in eetr-auth. Not a secret: it travels
    # in every authorization request the browser makes. Normally the same value
    # as admin.api.oidc.audience, which is what a token must name in `aud`.
    clientId: ""

    # Shown on the sign-in button, as "Sign in with …".
    providerName: Eetr Auth

    # Comma-separated addresses permitted to make changes. Empty means every
    # operator who can sign in may write, which is right for a single operator —
    # eetr-auth already refuses anyone who has not been granted this client's
    # environment. Set it to hand someone the panel read-only.
    writeEmails: ""

    # Both values seal or unlock something, so they come from a Secret created
    # outside Helm. The installer verifies it exists before Helm runs.
    #
    # Create it with:
    #   kubectl -n admin create secret generic admin-oidc \
    #     --from-literal=authSecret="$(openssl rand -base64 32)" \
    #     --from-literal=clientSecret=THE_CLIENT_SECRET
    secret:
      name: admin-oidc
      # Seals the session cookie, which carries the operator's access and refresh
      # tokens. Rotating it signs everybody out.
      authSecretKey: authSecret
      clientSecretKey: clientSecret

    image:
      repository: registry.example.invalid/home-lab/admin-web
      tag: "0.0.0"
      pullPolicy: IfNotPresent

    # One, deliberately, and this is not the same kind of "one" as the agent's.
    #
    # Sessions are stateless — the Auth.js cookie is a JWE carrying the operator's
    # access and refresh tokens — so more replicas would serve requests perfectly
    # well. What does not survive is the token REFRESH. eetr-auth rotates refresh
    # tokens with OAuth 2.1 reuse detection, so presenting a superseded one
    # cascade-revokes the family and signs the operator out everywhere. Two
    # concurrent requests from one browser both carry the same cookie — neither
    # response has returned, so neither can have seen the other's rotation — and
    # src/lib/auth/refresh.ts collapses them into one exchange with an in-process
    # Map. Two replicas is two Maps, and the collapse fails whenever the pair lands
    # on different pods.
    #
    # Storing the token elsewhere does not fix it: a cookie has no compare-and-swap,
    # and it is the input to the race rather than a lock on it. What fixes it is a
    # shared lock, which is why platform.redis exists — the panel's refresh moving
    # behind it is what lets this become 2.
    replicas: 1

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

  # The panel's assistant.
  #
  # An Octo app — a flow definition with an ai-agent block in it — running on
  # Octo's public standalone runtime, with the definition baked into the image. It
  # is reached only through the panel: the drawer posts to a route handler in
  # admin-web, which authenticates the operator and attaches their bearer token, so
  # the agent reads the API as whoever is asking and holds no identity of its own.
  #
  # Off by default. It costs money per answer, it needs a provider key that does
  # not exist until somebody creates one, and a panel without it is a complete
  # panel.
  agent:
    enabled: false

    # As OpenRouter publishes model ids: vendor-prefixed, with no bare name. The
    # runtime reads this at startup, so changing it replaces the pod.
    model: deepseek/deepseek-v4-flash

    # default | none | minimal | low | medium | high. The connector validates this
    # when it starts, so a typo is a pod that will not start rather than a setting
    # that quietly did nothing.
    reasoning: medium

    # The OpenRouter key. A Secret created outside Helm like every other credential
    # here; the installer verifies it exists before Helm runs.
    #
    # Create it with:
    #   kubectl -n admin create secret generic admin-agent-llm \
    #     --from-literal=apiKey=sk-or-...
    secret:
      name: admin-agent-llm
      key: apiKey

    # Where the agent's memory and its workspace live.
    #
    # The NFS class rather than a local volume: the runtime's store is loaded from
    # this directory at startup, so a pod rescheduled onto another node has to find
    # it there. The claim is ReadWriteMany for the same reason the Deployment is
    # pinned to one replica — see the comment on it.
    #
    # Small on purpose. It holds conversations, a handful of remembered facts, and
    # whatever the agent has written in its workspace; anything large in there is a
    # bug rather than a capacity problem.
    storage:
      className: nfs-client
      size: 1Gi

    image:
      repository: registry.example.invalid/home-lab/admin-agent
      tag: "0.0.0"
      pullPolicy: IfNotPresent

    # Sized for one operator asking questions. The memory ceiling is what a long
    # conversation's context costs to hold, not what the model uses.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
