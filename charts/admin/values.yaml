# Placeholders are deliberately RFC-invalid, so a values file that was copied but
# never edited fails obviously rather than resolving to somebody's real host.
# scripts/install-admin.sh refuses to install while they are still present.

admin:
  # Per-namespace pull secrets, for a cluster whose nodes do not already hold the
  # registry credential.
  #
  # Empty by default because the nodes do hold it: ansible/roles/registry_credentials
  # writes it to the kubelet, so every namespace can pull without a copy of its own.
  # Set this only to override that for one release — a Secret named here must exist
  # in the release namespace, and the installer checks before Helm runs.
  imagePullSecrets: []

  # One tag for all three images, and normally not set at all.
  #
  # The API, the panel and the agent are built from one commit by one pipeline
  # and pushed under one tag, so a per-component tag could only ever express a
  # mistake: three keys where the build produces one value is three chances to
  # deploy a mismatched set and no way to express anything the pipeline can
  # actually produce.
  #
  # Empty means "the chart's appVersion", which is the same version the images
  # were published under -- release admin-v1.4.0 publishes chart 1.4.0 and images
  # 1.4.0. So installing chart 1.5.0 installs the 1.5.0 images by construction,
  # and a values file that pins a tag is overriding that rather than supplying
  # something missing. release-please keeps Chart.yaml in step with the release,
  # so this holds for a checkout too.
  #
  # Set it to run an image the chart was not released with -- a build from a
  # branch, or a pipeline naming an immutable digest-like tag of its own.
  #
  # Only the tag is shared. Each component keeps its own `repository`, because
  # those genuinely differ, and its own `pullPolicy`.
  #
  # No "latest": a pod pulling a moving name cannot say which build it is
  # running. Refused in values.schema.json and again in _helpers.tpl, because the
  # schema never sees a tag that arrives through appVersion.
  image:
    tag: ""

  # The Gateway the platform chart owns. A route only attaches when this
  # namespace carries the gateway-access label; the installer applies it.
  gateway:
    name: home-lab

  api:
    # Which identity provider's tokens the API accepts.
    #
    # The issuer is kept exactly as configured, trailing slash and all: it is an
    # identifier rather than a path, and normalizing it would silently fail every
    # issuer check against a provider whose own is spelled with one.
    #
    # The audience is the value a token must name in `aud`, and it is what stops a
    # token minted for another application being replayed here. eetr-auth puts the
    # client id there when no resource indicator is requested, so this is normally
    # the admin panel's client id. It is not a secret — it travels in every
    # authorization request — so it lives in values rather than a Secret.
    oidc:
      issuer: https://auth.example.invalid
      audience: ""

    # The managed services. Each is served only when configured, so a panel with
    # no MongoDB answers 404 for those routes rather than pretending.
    #
    # Both connection strings carry a superuser password, so they come from
    # Secrets created outside Helm — a values file holding one would end up in Git.
    # The installer verifies each Secret exists before Helm runs.
    # Reading the cluster needs no connection string: in the cluster the pod's own
    # ServiceAccount is the credential. On by default for that reason, and the
    # read-only ClusterRole below is created with it.
    kubernetes:
      enabled: true

      # Creating and deleting namespaces from the panel.
      #
      # Off by default, and it is the second grant here worth a deliberate
      # decision. Everything else this ClusterRole holds either reads, or changes
      # how many of something already exists; this is the first that brings
      # something into being and takes something away — and deleting a namespace
      # cascades to every workload, Secret, and volume claim in it.
      #
      # What bounds it is not RBAC, which has no way to say "any namespace except
      # these". It is the policy in the API: Kubernetes' own namespaces and
      # anything under the kube- prefix, the namespace the panel itself runs in,
      # the list below, and any namespace carrying the
      # home-lab.example/protected label are all refused. The label is read off
      # the live object, so protecting one more is a kubectl label rather than a
      # release.
      namespaces:
        manage: false

        # Namespaces this lab will not let the panel delete, on top of the
        # built-in rules above. Names only — the API adds its own namespace from
        # the downward API, so it is not listed here and cannot be removed from
        # here.
        protected:
          - platform-system

        # The Pod Security admission level stamped on a namespace the panel
        # creates. Baseline rather than restricted: restricted refuses containers
        # that do not declare a non-root user, which is most upstream charts, and
        # a level that has to be turned off to install anything is a level that
        # gets turned off.
        podSecurity: baseline

      # Node disk usage, read from each kubelet's stats endpoint.
      #
      # Off by default, and it is the one grant here worth a deliberate decision.
      # Disk usage is not in the Kubernetes API and metrics-server reports only CPU
      # and memory, so the only source is the kubelet — which means `get` on the
      # nodes/proxy subresource, and that also opens the kubelet's other read
      # endpoints, including the one that serves files under /var/log on the host.
      #
      # Left off, the panel reports every other node figure and shows the node's
      # allocatable ephemeral storage in place of a usage reading, labelled as the
      # scheduling ceiling it is. Nothing else changes.
      nodeStats:
        enabled: false

    # The superuser the panel administers the server as. It also runs the
    # read-only query console — there is no second credential, so access to the
    # panel is access to whatever that account can do, up to and including the
    # container the server runs in. databases/README.md says what that means.
    postgres:
      enabled: false
      secret:
        name: admin-postgres
        key: dsn
    mongo:
      enabled: false
      secret:
        name: admin-mongo
        key: uri

    image:
      repository: registry.example.invalid/home-lab/admin-api
      pullPolicy: IfNotPresent

    # Two, because this is the one service here that can actually take it.
    #
    # The API holds no state: every request carries the operator's bearer token,
    # the Kubernetes reads go through the pod's own ServiceAccount, and the
    # database connections are per-request. There is nothing in a process that a
    # second process would disagree with, so a request arriving mid-rollout is
    # served by whichever replica is ready.
    #
    # This is availability rather than throughput — a panel one operator uses is
    # not short of capacity. What two replicas buy is that a node drained for
    # maintenance, or a pod OOM-killed, does not take the panel's API with it. The
    # PodDisruptionBudget beside this covers the first of those; nothing covers the
    # second, which is why the number is 2 and not 1.
    replicas: 2

    # Sized for a panel one operator uses, not for throughput. Per replica, so the
    # count above multiplies these.
    # Raised when the Helm SDK was linked in. It is not a small dependency: it
    # carries a large slice of kubectl, an OCI registry client, and its own YAML
    # stack, and the API binary went from 45.6 MB to 95.6 MB. A Go binary's text
    # is mapped rather than allocated, so that is not fifty megabytes of heap --
    # but 128Mi with a 96 MB binary, a discovery cache, a REST mapper, and a
    # rendered chart in flight is close enough to the edge that the first thing
    # to go wrong would be an OOMKill part-way through an install.
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        memory: 256Mi

    # Helm releases.
    #
    # The panel declares a chart for a namespace -- an OCI or HTTPS chart
    # reference, a version, and a values file the operator writes -- and rolls it
    # out. What is *running* is always read live from Helm's own storage, so a
    # release installed by hand from a laptop shows up here with nothing having
    # recorded it, and a release changed outside the panel shows up as drift
    # rather than being quietly overwritten.
    #
    # READ templates/api/rbac-deploy.yaml BEFORE ADDING A NAMESPACE.
    #
    # Helm keeps a release in a Secret, so reading releases in a namespace means
    # reading *every* Secret in that namespace -- RBAC cannot narrow it to Helm's
    # own, and no label selector exists that would. A namespace named here is a
    # namespace whose credentials this panel can read. That is the entire cost of
    # the feature and it is not reducible.
    #
    # There is also no allowlist of installable charts, and nothing narrowing what
    # a caller may do: this API checks that a token is authentic and asks nothing
    # about permission, so anyone holding one can install any chart this cluster
    # can reach -- and a chart's templates are arbitrary manifests. The deploy
    # Role below is what bounds the damage, and it is the only thing that does.
    # A repository allowlist belongs here when this lab grows one, and per-subject
    # authorization is coming as a platform module.
    helm:
      # Deploy Helm releases from the panel.
      #
      # Off leaves the deployment routes answering 501: the capability is built,
      # and this lab has not switched it on.
      #
      # READ templates/api/rbac-deploy.yaml BEFORE SWITCHING IT ON. On, the panel
      # can enrol any namespace that is not protected -- and an enrolled namespace
      # is one whose every Secret it can read. That is the cost of the feature and
      # it is not reducible: Helm keeps a release in a Secret, and RBAC cannot
      # narrow a Secret grant to Helm's own.
      #
      # There is also no allowlist of installable charts, and nothing narrowing
      # what a caller may do: this API checks that a token is authentic and asks
      # nothing about permission, so anyone holding one can install any chart this
      # cluster can reach -- and a chart's templates are arbitrary manifests. The
      # deploy grant is what bounds the damage, and it is the only thing that does.
      enabled: false

      # Namespaces enrolled at install time.
      #
      # NOT an allowlist. Every other namespace is enrolled from the panel, at
      # runtime, with nothing to reinstall -- which is the whole point: the grant
      # is a RoleBinding onto a ClusterRole this chart owns, so it no longer has
      # to be rendered per namespace.
      #
      # This list exists for the namespaces that cannot be enrolled from the panel
      # because there is no panel yet: its own, and anything a pipeline deploys
      # into on a fresh install.
      #
      # A protected namespace here is a render failure rather than a warning.
      namespaces: []
        # - apps

      # The Job that performs one Helm operation.
      #
      # Every Helm mutation -- install, upgrade, rollback, uninstall -- runs as a
      # Kubernetes Job rather than inside the API's own pods. Three things follow,
      # and all three are why:
      #
      #   - The deploy grant belongs to the Job's ServiceAccount and not to the
      #     long-lived credential two API pods carry a token for. The API keeps
      #     read-only access. Read the warning in
      #     templates/api/rbac-deploy.yaml before concluding that is a smaller
      #     grant than it was; it is a differently shaped one.
      #   - Upgrading the panel itself is no longer a special case. A Job is not
      #     replaced by the chart it applies, so the readiness wait stays on and
      #     "deployed" means the pods came up -- for every release, including this
      #     one.
      #   - A failure has somewhere to put its logs, and the 202 names an object
      #     with a status.
      #
      # There is deliberately no image override here: the Job runs the API's own
      # image under a subcommand, and the whole design rests on it being the same
      # binary with one copy of the chart-resolution and values-merge logic. Nor a
      # serviceAccount key -- which identity it runs as is a security property of
      # this chart, not a preference.
      job:
        # How long a finished Job -- and therefore its log -- is kept.
        #
        # The log is a view, not the record. What actually survives a deploy is
        # Helm's release history and the rollout stamp in PostgreSQL; the pod's
        # log can also vanish earlier than this to kubelet garbage collection,
        # which nothing here controls. A day is enough for "I deployed this
        # morning, what happened", and without a TTL these accumulate in the
        # panel's namespace forever with nothing in this lab to prune them.
        ttlSecondsAfterFinished: 86400

        # Requests and limits for the Job's pod. It pulls a chart, renders it,
        # and waits; the waiting is nearly free and the rendering is brief.
        #
        # Set rather than empty, like every other workload in this chart. A pod
        # with no requests is BestEffort, and BestEffort is the first thing the
        # kubelet evicts under node pressure — which here would mean killing the
        # pod holding a release half-applied, and leaving it wedged in a
        # pending-* state that nothing clears on its own.
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            memory: 256Mi

      # Where the declared charts and their values are kept.
      #
      # This is the one piece of state the API owns, and it holds desired state
      # only: the chart reference, and an append-only series of (version, values)
      # pairs. Nothing about what is *running* is stored here -- that is read from
      # Helm every time it is asked for, because two records of one truth would
      # disagree the first time a pod was killed mid-upgrade.
      #
      # Its own database and its own role, not the superuser connection string the
      # panel administers PostgreSQL with: that one exists to manage somebody
      # else's server and backs the read-only query console. Create the database,
      # the role and the Secret before installing.
      #
      # Disabled leaves the deployment routes answering 501; the release routes
      # still read the cluster, because reading it never needed a record.
      postgres:
        enabled: false
        secret:
          name: admin-helm-postgres
          key: dsn

    # Reaching the API from outside the cluster, for a caller that is not the
    # panel's own browser session. Disabled until something needs it: the agent
    # that will call the API directly is not built yet, and an administrative
    # endpoint should not be publicly routable before it has a reason to be.
    #
    # Enabling it means putting Cloudflare Access in front of the hostname first.
    route:
      enabled: false
      hostname: admin-api.example.invalid

  # The panel itself: the browser-facing half, and an OIDC client of eetr-auth.
  web:
    # The hostname the panel is served on. Also the base of the redirect URI that
    # must be registered with eetr-auth, as https://<hostname>/api/auth/callback/eetr,
    # and eetr-auth matches it exactly — no wildcards.
    #
    # Put Cloudflare Access in front of it before pointing DNS here.
    hostname: admin.example.invalid

    # The origin the browser actually reaches the panel on, when that is not
    # https://<hostname>. Empty means derive it, which is what a real install
    # wants.
    #
    # It exists for a local cluster reached through a port-forward, where the
    # panel answers on http://localhost:3000 and the derived URL is a host
    # nothing serves. Without it the only way to correct AUTH_URL is to patch the
    # Deployment by hand, and the next `helm upgrade` puts it back -- which is a
    # sign-in that breaks every time the chart is rolled forward, for a reason
    # that is nowhere in the values.
    #
    # Whatever is set here must still be registered with eetr-auth as
    # <authUrl>/api/auth/callback/eetr, matched exactly.
    authUrl: ""

    # The confidential client registered in eetr-auth. Not a secret: it travels
    # in every authorization request the browser makes. Normally the same value
    # as admin.api.oidc.audience, which is what a token must name in `aud`.
    clientId: ""

    # Shown on the sign-in button, as "Sign in with …".
    providerName: Eetr Auth

    # Comma-separated addresses permitted to make changes. Empty means every
    # operator who can sign in may write, which is right for a single operator —
    # eetr-auth already refuses anyone who has not been granted this client's
    # environment. Set it to hand someone the panel read-only.
    writeEmails: ""

    # Both values seal or unlock something, so they come from a Secret created
    # outside Helm. The installer verifies it exists before Helm runs.
    #
    # Create it with:
    #   kubectl -n admin create secret generic admin-oidc \
    #     --from-literal=authSecret="$(openssl rand -base64 32)" \
    #     --from-literal=clientSecret=THE_CLIENT_SECRET
    secret:
      name: admin-oidc
      # Seals the session cookie, which carries the operator's access and refresh
      # tokens. Rotating it signs everybody out.
      authSecretKey: authSecret
      clientSecretKey: clientSecret

    image:
      repository: registry.example.invalid/home-lab/admin-web
      pullPolicy: IfNotPresent

    # Two, now that the token refresh is coordinated.
    #
    # This was one for a long time and the reason is worth keeping, because it is
    # what the `redis` block below is for. Sessions themselves are stateless — the
    # Auth.js cookie is a JWE carrying the operator's access and refresh tokens —
    # so more replicas always served requests fine. What did not survive was the
    # token REFRESH: eetr-auth rotates refresh tokens with OAuth 2.1 reuse
    # detection, so presenting a superseded one cascade-revokes the family and
    # signs the operator out everywhere. Two concurrent requests from one browser
    # carry the same cookie — neither response has returned, so neither can have
    # seen the other's rotation — and the single-flight collapsing them was an
    # in-process Map. Two replicas was two Maps.
    #
    # Raising this without `redis` below configured is a render failure rather
    # than a setting that quietly reintroduces that race — see the template.
    replicas: 2

    # Where the replicas agree with each other about a token refresh.
    #
    # THE SECRET IS A SEPARATE ONE FROM THE PLATFORM CHART'S, and that is
    # Kubernetes rather than a choice: a Secret is namespaced, so platform-system's
    # `redis-password` cannot be read from here. Create one in this namespace
    # holding the same value:
    #
    #   kubectl -n admin create secret generic admin-redis \
    #     --from-literal=password="$REDIS_PASSWORD"
    #
    # The panel also has to be allowed to reach Redis at all: the platform chart's
    # NetworkPolicy admits only namespaces labelled for it, and the installer
    # applies that label the same way it applies the Gateway's.
    redis:
      enabled: true
      # The platform chart's Service. In-cluster, so this never leaves the cluster
      # network and is a plain redis:// rather than rediss://.
      url: redis://redis.platform-system.svc.cluster.local:6379
      secret:
        name: admin-redis
        key: password

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

  # The panel's assistant.
  #
  # An Octo app — a flow definition with an ai-agent block in it — running on
  # Octo's public standalone runtime, with the definition baked into the image. It
  # is reached only through the panel: the drawer posts to a route handler in
  # admin-web, which authenticates the operator and attaches their bearer token, so
  # the agent reads the API as whoever is asking and holds no identity of its own.
  #
  # Off by default. It costs money per answer, it needs a provider key that does
  # not exist until somebody creates one, and a panel without it is a complete
  # panel.
  agent:
    enabled: false

    # As OpenRouter publishes model ids: vendor-prefixed, with no bare name. The
    # runtime reads this at startup, so changing it replaces the pod.
    model: deepseek/deepseek-v4-flash

    # default | none | minimal | low | medium | high. The connector validates this
    # when it starts, so a typo is a pod that will not start rather than a setting
    # that quietly did nothing.
    reasoning: medium

    # The OpenRouter key. A Secret created outside Helm like every other credential
    # here; the installer verifies it exists before Helm runs.
    #
    # Create it with:
    #   kubectl -n admin create secret generic admin-agent-llm \
    #     --from-literal=apiKey=sk-or-...
    secret:
      name: admin-agent-llm
      key: apiKey

    # Where the agent's memory and its workspace live.
    #
    # The NFS class rather than a local volume: the runtime's store is loaded from
    # this directory at startup, so a pod rescheduled onto another node has to find
    # it there. The claim is ReadWriteMany for the same reason the Deployment is
    # pinned to one replica — see the comment on it.
    #
    # Small on purpose. It holds conversations, a handful of remembered facts, and
    # whatever the agent has written in its workspace; anything large in there is a
    # bug rather than a capacity problem.
    storage:
      className: nfs-client
      size: 1Gi

    image:
      repository: registry.example.invalid/home-lab/admin-agent
      pullPolicy: IfNotPresent

    # Sized for one operator asking questions. The memory ceiling is what a long
    # conversation's context costs to hold, not what the model uses.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
