# Placeholders are deliberately RFC-invalid, so a values file that was copied but
# never edited fails obviously rather than resolving to somebody's real host.
# scripts/install-admin.sh refuses to install while they are still present.

admin:
  # Per-namespace pull secrets, for a cluster whose nodes do not already hold the
  # registry credential.
  #
  # Empty by default because the nodes do hold it: ansible/roles/registry_credentials
  # writes it to the kubelet, so every namespace can pull without a copy of its own.
  # Set this only to override that for one release — a Secret named here must exist
  # in the release namespace, and the installer checks before Helm runs.
  imagePullSecrets: []

  # The Gateway the platform chart owns. A route only attaches when this
  # namespace carries the gateway-access label; the installer applies it.
  gateway:
    name: home-lab

  api:
    # Which identity provider's tokens the API accepts.
    #
    # The issuer is kept exactly as configured, trailing slash and all: it is an
    # identifier rather than a path, and normalizing it would silently fail every
    # issuer check against a provider whose own is spelled with one.
    #
    # The audience is the value a token must name in `aud`, and it is what stops a
    # token minted for another application being replayed here. eetr-auth puts the
    # client id there when no resource indicator is requested, so this is normally
    # the admin panel's client id. It is not a secret — it travels in every
    # authorization request — so it lives in values rather than a Secret.
    oidc:
      issuer: https://auth.example.invalid
      audience: ""

    # The managed services. Each is served only when configured, so a panel with
    # no MongoDB answers 404 for those routes rather than pretending.
    #
    # Both connection strings carry a superuser password, so they come from
    # Secrets created outside Helm — a values file holding one would end up in Git.
    # The installer verifies each Secret exists before Helm runs.
    # Reading the cluster needs no connection string: in the cluster the pod's own
    # ServiceAccount is the credential. On by default for that reason, and the
    # read-only ClusterRole below is created with it.
    kubernetes:
      enabled: true
      # Node disk usage, read from each kubelet's stats endpoint.
      #
      # Off by default, and it is the one grant here worth a deliberate decision.
      # Disk usage is not in the Kubernetes API and metrics-server reports only CPU
      # and memory, so the only source is the kubelet — which means `get` on the
      # nodes/proxy subresource, and that also opens the kubelet's other read
      # endpoints, including the one that serves files under /var/log on the host.
      #
      # Left off, the panel reports every other node figure and shows the node's
      # allocatable ephemeral storage in place of a usage reading, labelled as the
      # scheduling ceiling it is. Nothing else changes.
      nodeStats:
        enabled: false

    postgres:
      enabled: false
      secret:
        name: admin-postgres
        key: dsn
    mongo:
      enabled: false
      secret:
        name: admin-mongo
        key: uri

    image:
      repository: registry.example.invalid/home-lab/admin-api
      tag: "0.0.0"
      pullPolicy: IfNotPresent

    replicas: 1

    # The API holds no state, so a request that arrives mid-rollout is served by
    # whichever replica is ready. Resources are sized for a panel one operator
    # uses, not for throughput.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

    # Reaching the API from outside the cluster, for a caller that is not the
    # panel's own browser session. Disabled until something needs it: the agent
    # that will call the API directly is not built yet, and an administrative
    # endpoint should not be publicly routable before it has a reason to be.
    #
    # Enabling it means putting Cloudflare Access in front of the hostname first.
    route:
      enabled: false
      hostname: admin-api.example.invalid

  # The panel itself: the browser-facing half, and an OIDC client of eetr-auth.
  web:
    # The hostname the panel is served on. Also the base of the redirect URI that
    # must be registered with eetr-auth, as https://<hostname>/api/auth/callback/eetr,
    # and eetr-auth matches it exactly — no wildcards.
    #
    # Put Cloudflare Access in front of it before pointing DNS here.
    hostname: admin.example.invalid

    # The confidential client registered in eetr-auth. Not a secret: it travels
    # in every authorization request the browser makes. Normally the same value
    # as admin.api.oidc.audience, which is what a token must name in `aud`.
    clientId: ""

    # Shown on the sign-in button, as "Sign in with …".
    providerName: Eetr Auth

    # Comma-separated addresses permitted to make changes. Empty means every
    # operator who can sign in may write, which is right for a single operator —
    # eetr-auth already refuses anyone who has not been granted this client's
    # environment. Set it to hand someone the panel read-only.
    writeEmails: ""

    # Both values seal or unlock something, so they come from a Secret created
    # outside Helm. The installer verifies it exists before Helm runs.
    #
    # Create it with:
    #   kubectl -n admin create secret generic admin-oidc \
    #     --from-literal=authSecret="$(openssl rand -base64 32)" \
    #     --from-literal=clientSecret=THE_CLIENT_SECRET
    secret:
      name: admin-oidc
      # Seals the session cookie, which carries the operator's access and refresh
      # tokens. Rotating it signs everybody out.
      authSecretKey: authSecret
      clientSecretKey: clientSecret

    image:
      repository: registry.example.invalid/home-lab/admin-web
      tag: "0.0.0"
      pullPolicy: IfNotPresent

    # One, deliberately. Sessions are stateless — the cookie carries them — so
    # more replicas would serve fine, but the token refresh is deduplicated per
    # process. Two replicas can therefore present the same rotating refresh token
    # at once, and eetr-auth's reuse detection answers that by revoking the whole
    # family. Raising this means moving that lock somewhere shared first.
    replicas: 1

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
