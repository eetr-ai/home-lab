apiVersion: v1
kind: Service
metadata:
  name: admin-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: admin-api
    {{- include "home-lab-admin.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: admin-api
  ports:
    - name: http
      port: 80
      targetPort: http
