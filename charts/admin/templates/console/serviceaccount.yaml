{{- if .Values.admin.console.enabled }}
{{- /*
The console's identity, and the only subject of the cluster-admin binding in
rbac.yaml. Its own account rather than admin-api's, so that grant cannot leak to
the API's two long-lived pods, and so removing the console removes the grant.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-console
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: admin-console
    {{- include "home-lab-admin.labels" . | nindent 4 }}
{{- end }}
