apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: admin-api
    {{- include "home-lab-admin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.admin.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-api
  template:
    metadata:
      {{- if .Values.admin.api.helm.charts }}
      annotations:
        # Editing the catalog is editing a ConfigMap, and a mounted ConfigMap
        # updates in place without restarting anything. The API reads the catalog
        # once at startup, so without this the values file would change and the
        # running panel would not.
        checksum/helm-catalog: {{ include (print $.Template.BasePath "/api/helm-catalog.yaml") . | sha256sum }}
      {{- end }}
      labels:
        app.kubernetes.io/name: admin-api
    spec:
      # Spread across nodes where the cluster can manage it. Preferred rather than
      # required, and that is the whole point on a home lab: `required` on a
      # single-node cluster leaves the second replica Pending forever, which turns
      # a redundancy feature into an outage. Two replicas on one node still
      # survive the thing that actually happens most — a rollout, and a pod being
      # evicted or OOM-killed.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: admin-api
      serviceAccountName: admin-api
      automountServiceAccountToken: true
      {{- with .Values.admin.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin-api
          image: {{ include "home-lab-admin.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.admin.api.image.pullPolicy }}
          env:
            - name: ADMIN_OIDC_ISSUER
              value: {{ required "admin.api.oidc.issuer is required" .Values.admin.api.oidc.issuer | quote }}
            - name: ADMIN_OIDC_AUDIENCE
              value: {{ .Values.admin.api.oidc.audience | quote }}
            - name: ADMIN_OIDC_REQUIRE_SCOPES
              value: {{ .Values.admin.api.oidc.requireScopes | quote }}
            {{- if not .Values.admin.api.kubernetes.enabled }}
            - name: ADMIN_KUBERNETES_DISABLED
              value: "true"
            {{- end }}
            {{- if and .Values.admin.api.kubernetes.enabled .Values.admin.api.kubernetes.nodeStats.enabled }}
            - name: ADMIN_KUBERNETES_NODE_STATS
              value: "true"
            {{- end }}
            {{- if .Values.admin.api.kubernetes.enabled }}
            # Which namespace the panel is running in, so it can refuse to delete
            # itself. From the downward API rather than a literal, because the
            # chart can be installed under any release name and a hardcoded name
            # would silently stop matching.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ADMIN_PROTECTED_NAMESPACES
              value: {{ join "," .Values.admin.api.kubernetes.namespaces.protected | quote }}
            - name: ADMIN_NAMESPACE_POD_SECURITY
              value: {{ .Values.admin.api.kubernetes.namespaces.podSecurity | quote }}
            - name: ADMIN_HELM_MANAGED_NAMESPACES
              value: {{ join "," .Values.admin.api.helm.namespaces | quote }}
            {{- if .Values.admin.api.helm.charts }}
            - name: ADMIN_HELM_CATALOG
              value: /etc/admin-api/helm/catalog.yaml
            {{- end }}
            # Helm's downloader writes a repository index to its cache before
            # reading it, and this pod's root filesystem is read-only. An
            # emptyDir rather than a claim: the contents are derivable, and a
            # claim would make a two-replica Deployment fight over one volume.
            - name: HELM_CACHE_HOME
              value: /helm/cache
            - name: HELM_CONFIG_HOME
              value: /helm/config
            - name: HELM_DATA_HOME
              value: /helm/data
            - name: XDG_CACHE_HOME
              value: /helm/cache
            {{- end }}
            {{- if not .Values.admin.api.kubernetes.enabled }}
            # Helm reaches the cluster through the same credential the cluster
            # slice does, so it cannot be served without it.
            - name: ADMIN_HELM_DISABLED
              value: "true"
            {{- end }}
            {{- if .Values.admin.api.postgres.enabled }}
            - name: ADMIN_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.api.postgres.secret.name }}
                  key: {{ .Values.admin.api.postgres.secret.key }}
            {{- end }}
            {{- if .Values.admin.api.mongo.enabled }}
            - name: ADMIN_MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.api.mongo.secret.name }}
                  key: {{ .Values.admin.api.mongo.secret.key }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            # Slower than readiness on purpose: readiness taking a pod out of
            # rotation is cheap, restarting it is not.
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.admin.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # The binary logs to stdout and writes nothing of its own. Helm's
            # downloader does write -- a repository index, before reading it --
            # so it is given a volume rather than the root filesystem.
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            {{- if .Values.admin.api.kubernetes.enabled }}
            - name: helm-cache
              mountPath: /helm
            {{- end }}
            {{- if .Values.admin.api.helm.charts }}
            - name: helm-catalog
              mountPath: /etc/admin-api/helm
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.admin.api.kubernetes.enabled }}
        # Derivable content, so an emptyDir rather than a claim: a claim would
        # make a two-replica Deployment fight over one ReadWriteOnce volume, and
        # there is nothing here worth keeping across a restart. The size limit is
        # not optional -- an emptyDir without one is node disk with no ceiling.
        - name: helm-cache
          emptyDir:
            sizeLimit: 256Mi
        {{- end }}
        {{- if .Values.admin.api.helm.charts }}
        - name: helm-catalog
          configMap:
            name: {{ .Release.Name }}-helm-catalog
        {{- end }}
