apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: admin-api
    {{- include "home-lab-admin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.admin.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-api
    spec:
      # Spread across nodes where the cluster can manage it. Preferred rather than
      # required, and that is the whole point on a home lab: `required` on a
      # single-node cluster leaves the second replica Pending forever, which turns
      # a redundancy feature into an outage. Two replicas on one node still
      # survive the thing that actually happens most — a rollout, and a pod being
      # evicted or OOM-killed.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: admin-api
      serviceAccountName: admin-api
      automountServiceAccountToken: true
      {{- with .Values.admin.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin-api
          image: {{ include "home-lab-admin.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.admin.api.image.pullPolicy }}
          env:
            - name: ADMIN_OIDC_ISSUER
              value: {{ required "admin.api.oidc.issuer is required" .Values.admin.api.oidc.issuer | quote }}
            - name: ADMIN_OIDC_AUDIENCE
              value: {{ .Values.admin.api.oidc.audience | quote }}
            {{- if not .Values.admin.api.kubernetes.enabled }}
            - name: ADMIN_KUBERNETES_DISABLED
              value: "true"
            {{- end }}
            {{- if and .Values.admin.api.kubernetes.enabled .Values.admin.api.kubernetes.nodeStats.enabled }}
            - name: ADMIN_KUBERNETES_NODE_STATS
              value: "true"
            {{- end }}
            {{- if .Values.admin.api.kubernetes.enabled }}
            # Which namespace the panel is running in, so it can refuse to delete
            # itself. From the downward API rather than a literal, because the
            # chart can be installed under any release name and a hardcoded name
            # would silently stop matching.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ADMIN_PROTECTED_NAMESPACES
              value: {{ join "," .Values.admin.api.kubernetes.namespaces.protected | quote }}
            - name: ADMIN_NAMESPACE_POD_SECURITY
              value: {{ .Values.admin.api.kubernetes.namespaces.podSecurity | quote }}
            {{- if .Values.admin.api.helm.enabled }}
            # The Job that performs one Helm operation. It runs this same image,
            # templated from the same helper the container above uses so the two
            # cannot drift — and note the consequence: a self-upgrade is carried
            # out by the binary running now, not by the one being installed. That
            # is the right way round. The code doing the upgrading is the code
            # that was reviewed and is known to work.
            - name: ADMIN_HELM_JOB_IMAGE
              value: {{ include "home-lab-admin.apiImage" . | quote }}
            - name: ADMIN_HELM_JOB_IMAGE_PULL_POLICY
              value: {{ .Values.admin.api.image.pullPolicy | quote }}
            # Named here rather than chosen per request. Nothing a caller sends
            # decides which identity a Helm Job runs as — see the warning in
            # rbac-jobs.yaml for why that is the only thing bounding this today.
            - name: ADMIN_HELM_JOB_SERVICE_ACCOUNT
              value: admin-helm-job
            - name: ADMIN_HELM_JOB_TTL_SECONDS
              value: {{ .Values.admin.api.helm.job.ttlSecondsAfterFinished | quote }}
            - name: ADMIN_HELM_JOB_RESOURCES
              value: {{ .Values.admin.api.helm.job.resources | toJson | quote }}
            {{- with .Values.admin.imagePullSecrets }}
            {{- $names := list }}
            {{- range . }}{{ $names = append $names .name }}{{ end }}
            # The Job pulls the same image from the same registry, so it needs
            # the same pull secrets. Names only — the Secrets themselves are
            # created outside this chart.
            - name: ADMIN_HELM_JOB_PULL_SECRETS
              value: {{ join "," $names | quote }}
            {{- end }}
            # What the panel binds when it enrols a namespace, and which accounts
            # it binds them to. All of it names objects this chart renders.
            #
            # Inside the Helm block, with the Job's account it is checked against.
            # The API treats a release name with no job account as a configuration
            # error and refuses to start -- correctly, because a panel that can
            # enrol a namespace and cannot name the account it would grant to is
            # broken rather than merely limited. Rendered outside this block, that
            # is exactly what a Kubernetes-only install produced: an admin-api
            # that exited at startup.
            #
            # There is deliberately no list of managed namespaces here any more.
            # It used to be one, and it was the second reason enrolling a
            # namespace needed a chart release: even with the grant in place, the
            # API read the set from this variable, so the pods had to restart
            # before a new namespace existed as far as they were concerned. The
            # set is read from the cluster now, per request.
            - name: ADMIN_HELM_RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: ADMIN_API_SERVICE_ACCOUNT
              value: admin-api
            {{- end }}
            {{- end }}
            {{- if and .Values.admin.api.kubernetes.enabled .Values.admin.api.helm.postgres.enabled }}
            # Where declared deployments and their values are kept. Absent, the
            # deployment routes answer 501 and the release routes still read the
            # cluster.
            - name: ADMIN_HELM_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.api.helm.postgres.secret.name }}
                  key: {{ .Values.admin.api.helm.postgres.secret.key }}
            # The same credential, as a name and a key rather than a value, so
            # the API can put a secretKeyRef in the Job it creates without ever
            # handling the connection string itself. A Job is not a Secret:
            # anything able to list Jobs in this namespace can read every literal
            # in one, so copying the DSN across would be publishing it.
            - name: ADMIN_HELM_DSN_SECRET_NAME
              value: {{ .Values.admin.api.helm.postgres.secret.name | quote }}
            - name: ADMIN_HELM_DSN_SECRET_KEY
              value: {{ .Values.admin.api.helm.postgres.secret.key | quote }}
            {{- end }}
            {{- if not .Values.admin.api.kubernetes.enabled }}
            # Helm reaches the cluster through the same credential the cluster
            # slice does, so it cannot be served without it.
            - name: ADMIN_HELM_DISABLED
              value: "true"
            {{- end }}
            {{- if .Values.admin.api.kubernetes.enabled }}
            # Helm writes while it works: it downloads a chart, unpacks it, and
            # keeps an OCI layer cache. The root filesystem is read-only, so it
            # is pointed at an emptyDir instead. XDG_CACHE_HOME is here too
            # because Helm's registry client reaches for it directly rather than
            # going through HELM_CACHE_HOME.
            #
            # Still needed here even though installs happen in a Job: listing a
            # chart's versions fetches a repository index or an OCI tag list on
            # the request path, and that writes to the cache. The Job carries its
            # own equivalent, built in Go.
            - name: HELM_CACHE_HOME
              value: /helm/cache
            - name: HELM_CONFIG_HOME
              value: /helm/config
            - name: HELM_DATA_HOME
              value: /helm/data
            - name: XDG_CACHE_HOME
              value: /helm/cache
            {{- end }}
            {{- if .Values.admin.api.postgres.enabled }}
            - name: ADMIN_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.api.postgres.secret.name }}
                  key: {{ .Values.admin.api.postgres.secret.key }}
            {{- end }}
            {{- if .Values.admin.api.mongo.enabled }}
            - name: ADMIN_MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.api.mongo.secret.name }}
                  key: {{ .Values.admin.api.mongo.secret.key }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            # Slower than readiness on purpose: readiness taking a pod out of
            # rotation is cheap, restarting it is not.
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.admin.api.resources | nindent 12 }}
          {{- if .Values.admin.api.kubernetes.enabled }}
          volumeMounts:
            - name: helm-cache
              mountPath: /helm
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # The binary is static and writes nothing to disk; it logs to stdout.
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
      {{- if .Values.admin.api.kubernetes.enabled }}
      volumes:
        # An emptyDir rather than a claim: the cache is derivable from the
        # registry, and a claim would make a two-replica Deployment fight over a
        # ReadWriteOnce volume. Bounded, because an unbounded scratch directory
        # on a node is somebody else's outage.
        - name: helm-cache
          emptyDir:
            sizeLimit: 256Mi
      {{- end }}
