{{- if .Values.admin.api.kubernetes.enabled }}
{{- if or .Values.admin.api.helm.namespaces .Values.admin.api.helm.allNamespaces }}
{{- /*
Installing and reading Helm releases, one namespace at a time.

READ THIS BEFORE ADDING A NAMESPACE TO THE LIST.

Start with the part that no configuration changes: INSTALLING AN ARBITRARY CHART
IS CLUSTER-ADMIN. A chart's templates are arbitrary manifests -- a
ClusterRoleBinding to cluster-admin, a DaemonSet mounting the host root, a
mutating webhook that rewrites every pod. Kubernetes' escalation prevention only
stops a ServiceAccount granting more than it holds, so the moment a grant is big
enough to install a real chart it is the thing it was meant to bound. There is no
RBAC rule that says "create a Deployment, but not a privileged one", and there is
no chart-shaped permission.

So the real boundary is not here. It is the chart catalog: the API installs an
entry somebody wrote into values.yaml at a version its declared repository
serves, and never a URL or a path a caller chose. Everything below is secondary
to that, and none of it would be sufficient without it.

What is bounded here is reach. The grant is a Role in one namespace, it names the
resources the catalogued charts actually need and no others, and it deliberately
holds nothing in rbac.authorization.k8s.io or apiextensions.k8s.io -- a chart
needing RBAC or CRDs is one to install by hand and then read from the panel, and
withholding those leaves escalation prevention nothing to escalate through.

ADD A RESOURCE THE SAME DAY YOU ADD THE CHART THAT NEEDS IT, not in advance. A
standing grant for something unused is a permission nobody is reviewing, which is
the rule the read ClusterRole next door already follows.

Helm keeps a release in a Secret in the namespace it was installed into: the
chart it came from, the values it was given, the manifests it rendered, and every
previous revision of all three. So reading releases means `get`, `list`, and
`watch` on Secrets — and RBAC has no way to narrow that to Helm's own. There is no
label selector in a Role, and `owner=helm` would buy nothing if there were.

  A Helm-managed namespace is a namespace whose every Secret this panel can read.

That is the whole cost of this feature, stated once and plainly. Anything holding
a token the API accepts can reach those Secrets through it. A namespace holding a
credential that matters must not appear in the list below.

The read ClusterRole next door deliberately excludes configmaps, on the reasoning
that plenty of workloads keep connection strings in one and the panel renders
whatever it reads. Secrets are strictly worse, which is exactly why this grant is
here rather than there:

  - A Role, not a ClusterRole. It reaches into one namespace and stops.
  - One per namespace named in admin.api.helm.namespaces, so the blast radius is
    a list somebody has to edit rather than the cluster.
  - Nothing wildcard, and nothing in rbac.authorization.k8s.io or
    apiextensions.k8s.io. A chart needing RBAC or CRDs is one to install by hand
    and then read from the panel, and withholding them leaves Kubernetes'
    escalation prevention nothing to escalate through.

There is a second mode, and it gives all of that up on purpose.

admin.api.helm.allNamespaces renders ONE ClusterRole instead of the per-namespace
Roles, because the panel can create namespaces and these Roles are rendered when
the chart is installed — so without it, a namespace created from the panel cannot
be deployed into until somebody reinstalls this chart. That breaks the workflow
the feature exists for.

  With allNamespaces on, the sentence above widens to: this panel can read every
  Secret in every namespace on the cluster.

Protection is unaffected in either mode — it is enforced in the API, and the
release namespace, platform-system, default and kube-* are refused whichever
grant is rendered. But protection is an application rule and this is a Kubernetes
grant, so with allNamespaces on the grant no longer backs the rule up. Turn it on
for a lab where one person holds every credential anyway; leave it off otherwise.

A protected namespace here is a render failure rather than a warning, because
"someone put platform-system in the managed list" is exactly the mistake that
turns a bounded grant into an unbounded one, and a warning in a Helm output
nobody reads is not a control.

tests/validate-admin-chart.sh asserts all of it: that a namespace list renders
Roles and never a ClusterRole, that allNamespaces renders exactly one ClusterRole
and no Role, that both grant the same verbs, that neither reaches
rbac.authorization.k8s.io or apiextensions.k8s.io, and that a protected namespace
in the list fails the render.
*/ -}}
{{- /*
The release namespace is NOT in this list, and that is deliberate. Deploying the
panel's own chart from a pipeline is what this feature was asked for, so its
namespace has to be a permitted Helm target. It is still not deletable — the API
refuses that separately, and for a different reason: deleting it destroys the
panel and everything in it, which no deploy needs.

Read the WARNING above before naming it, though. It is the namespace holding the
panel's OIDC client secret and its database connection strings, and a Role there
means the panel can read and rewrite all of them.
*/ -}}
{{- $protected := concat (list "default" "kube-system" "kube-public" "kube-node-lease")
      .Values.admin.api.kubernetes.namespaces.protected }}
{{- if .Values.admin.api.helm.allNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-helm
  labels:
    {{- include "home-lab-admin.labels" . | nindent 4 }}
rules:
  # Helm's release storage, and the resources a chart creates that live in the
  # core group. See the warning above: `secrets` here is every Secret in the
  # namespace, and RBAC cannot make it fewer.
  - apiGroups: [""]
    resources:
      - secrets
      - configmaps
      - services
      - serviceaccounts
      - persistentvolumeclaims
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # What a chart runs.
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read-only, and not because a chart creates one -- the Deployment controller
  # does. Helm waits for a release to become ready, and it computes a Deployment's
  # readiness by walking down to the ReplicaSets it owns. Without this the wait
  # never resolves: the chart applies, the pods come up healthy, and the release
  # sits in pending-install until the timeout gives up and marks it failed.
  #
  # That failure is worth describing because it looks like nothing is wrong. The
  # workload is running; only the release record disagrees. And it defeats the
  # completion check a pipeline makes, which waits for exactly that record.
  #
  # No write verbs: nothing here creates or deletes a ReplicaSet, and the rule
  # this file follows is that a grant arrives in the change that needs it.
  - apiGroups: ["apps"]
    resources:
      - replicasets
    verbs: ["get", "list", "watch"]
  # Chart hooks are Jobs, so a chart with a migration or an install hook needs
  # these even when it runs nothing on a schedule.
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Routing. This lab is Gateway API only -- the Ingress provider is switched off
  # in the platform chart -- so an Ingress grant would be a permission for
  # something that cannot work.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - httproutes
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Unconditional, and it used to be behind admin.api.helm.selfDeploy. That flag
  # existed because these verbs were held by the API's own long-lived credential,
  # which made "the panel can hand every permission it holds to any
  # ServiceAccount" a standing property of it. They belong to a Job that lives for
  # one operation now, so the flag was deleted rather than defaulted.
  #
  # This chart renders a ClusterRole, a ClusterRoleBinding, a Role and a
  # RoleBinding, so upgrading the panel needs all four.
  #
  # No escalate and no bind verb, deliberately. Without them Kubernetes refuses
  # to let this create a role holding more than the Job already holds, which is
  # the difference between a wide grant and an unbounded one.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-helm-read
  labels:
    {{- include "home-lab-admin.labels" . | nindent 4 }}
rules:
  # Reading a release, and the whole of what the API needs to answer every read
  # endpoint: Helm keeps a release in a Secret in the namespace it was installed
  # into -- the chart, the values, the rendered manifests, every revision.
  #
  # Read-only, and note what that changes. This used to be the same grant that
  # wrote. The API can no longer create, update or delete a Secret anywhere, in
  # any namespace, because nothing in its process writes to the cluster at all.
  #
  # The warning at the top still applies to the `get` half unchanged:
  #
  #   A Helm-managed namespace is a namespace whose every Secret this panel can
  #   read.
  #
  # RBAC has no way to narrow that to Helm's own. There is no label selector in a
  # Role, and `owner=helm` would buy nothing if there were.
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-helm-read
  labels:
    {{- include "home-lab-admin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-helm-read
subjects:
  - kind: ServiceAccount
    name: admin-api
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-helm
  labels:
    {{- include "home-lab-admin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-helm
subjects:
  - kind: ServiceAccount
    name: admin-helm-job
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range $namespace := .Values.admin.api.helm.namespaces }}
{{- if has $namespace $protected }}
{{- fail (printf "admin.api.helm.namespaces contains %s, which is a protected namespace" $namespace) }}
{{- end }}
{{- if hasPrefix "kube-" $namespace }}
{{- fail (printf "admin.api.helm.namespaces contains %s, and kube-* namespaces are Kubernetes' own" $namespace) }}
{{- end }}
---
