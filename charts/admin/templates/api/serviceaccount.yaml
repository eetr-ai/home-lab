{{- /*
The identity the API runs as, and the credential it reads the cluster with: the
read-only ClusterRole in rbac.yaml is bound to this account. The panel pod
deliberately has no ServiceAccount token of its own — it asks the API instead.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: admin-api
    {{- include "home-lab-admin.labels" . | nindent 4 }}
{{- if and .Values.admin.api.kubernetes.enabled (or .Values.admin.api.helm.namespaces .Values.admin.api.helm.allNamespaces) }}
---
{{- /*
The identity a Helm operation runs as, and the one that actually holds the deploy
grant in rbac-deploy.yaml.

It exists so that grant is not held by anything long-lived. The API creates a Job
that runs as this account, the Job does the work, and the account's reach exists
for the lifetime of that one operation.

READ THE WARNING AT THE TOP OF rbac-deploy.yaml before concluding this is
containment. Kubernetes does not check whether the creator of a Job may run as the
Job's ServiceAccount -- there is no `use` or `bind` verb on one -- so `create` on a
Job in this namespace is, in reach, equivalent to holding everything below. What
changed is that the API's two long-lived pods no longer carry it, not how much
authority is reachable through them.

No token is mounted anywhere by default: nothing runs as this account except the
Jobs the API creates.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-helm-job
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: admin-helm-job
    {{- include "home-lab-admin.labels" . | nindent 4 }}
{{- end }}
