{{- /*
The identity the API runs as. It holds no permissions yet — the read-only
ClusterRole arrives with the slice that reads the cluster — but the token is
mounted now because that identity is what those reads will use, and a token
belonging to an account with no bindings grants nothing.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: admin-api
    {{- include "home-lab-admin.labels" . | nindent 4 }}
