{{- if .Values.admin.agent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: admin-agent
    {{- include "home-lab-admin.labels" . | nindent 4 }}
spec:
  # One, and this is not a value anybody may raise.
  #
  # The reason narrowed with octo v0.8.8 and did not go away. It used to be that
  # the standalone runtime held the whole store in a process-local map and flushed
  # whole namespaces back, so a second replica would answer from its own copy and
  # overwrite the first's file. Memory is per-thread on disk now, and durable, so
  # a restart no longer costs a conversation — but it is still coordinated only
  # WITHIN a process: the per-thread lock is an in-process mutex, leader election
  # grants unconditionally because there is nothing to elect, and the transcript is
  # appended with O_APPEND, which is not atomic on NFS. The version check that
  # guards a working-memory write is read-then-write under that same in-process
  # lock, so across two pods it is a race rather than a compare-and-swap.
  #
  # A store two replicas could share needs the runtime's Kubernetes services
  # provider, and that needs ORCHESTRATOR_URL and NATS_URL — the whole Octo
  # platform, not a component of it. Until that is here, more replicas corrupt
  # conversations rather than serving more of them.
  replicas: 1
  # Recreate for the same reason, and it is load-bearing rather than tidy: the
  # default RollingUpdate briefly runs two pods writing to one volume, which is
  # exactly the case above. The cost is a few seconds with no agent during a
  # rollout, which is the right trade for a chat panel.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-agent
  # The prompt, the tools and the skills are baked into the image, so the tag is
  # most of this pod's configuration; the rest is the environment below. Both
  # replace pods when they change, which they have to — the runtime reads its
  # environment once, at startup, and never again.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-agent
    spec:
      # It holds a shell's worth of programs and reaches the network with curl, so
      # it is deliberately given no cluster credential at all. What it may read of
      # the cluster it reads through the admin API, as the operator who asked.
      automountServiceAccountToken: false
      {{- with .Values.admin.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # The NFS provisioner creates a directory the pod's uid can write, and
        # fsGroup is what makes that true on a server that maps groups rather than
        # users. It costs a recursive chown of a directory holding a few small
        # files, which is why it is set rather than reasoned about.
        fsGroup: 65532
      # The image creates /data/workspace and /data/store and owns them, but the
      # volume below mounts over /data and an empty PVC hides both. The file
      # connector stats its root as it starts, so without this the pod crash-loops
      # on a first install and only on a first install — the directories survive
      # once something has made them.
      #
      # The agent image rather than a smaller one: it is already being pulled, so
      # this adds no image to the pod and no second pull secret to get wrong.
      initContainers:
        - name: init-data-dirs
          image: {{ include "home-lab-admin.agentImage" . | quote }}
          imagePullPolicy: {{ .Values.admin.agent.image.pullPolicy }}
          command:
            - /bin/mkdir
            - -p
            - /data/workspace
            - /data/store
          resources:
            {{- toYaml .Values.admin.agent.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: admin-agent
          image: {{ include "home-lab-admin.agentImage" . | quote }}
          imagePullPolicy: {{ .Values.admin.agent.image.pullPolicy }}
          env:
            # The only secret this pod holds. Everything else it is trusted with
            # arrives per-request, on the header the panel attaches.
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.agent.secret.name }}
                  key: {{ .Values.admin.agent.secret.key }}
            # Vendor-prefixed, as OpenRouter publishes model ids.
            - name: LLM_MODEL
              value: {{ required "admin.agent.model is required" .Values.admin.agent.model | quote }}
            - name: LLM_REASONING
              value: {{ .Values.admin.agent.reasoning | quote }}
            # In-cluster, so the agent talks to the API directly rather than back
            # out through the Gateway — the same address the panel uses.
            - name: ADMIN_API_URL
              value: http://admin-api.{{ .Release.Namespace }}.svc.cluster.local
            # Both halves of the volume below. AGENT_WORKSPACE is declared by the
            # definition; OCTO_STORAGE_DIR is read by the runtime itself, which is
            # why it is not in that file's env block.
            - name: AGENT_WORKSPACE
              value: /data/workspace
            - name: OCTO_STORAGE_DIR
              value: /data/store
          ports:
            - name: http
              containerPort: 8080
            # The runtime's admin port, separate from any http connector so probes
            # never collide with a route. The chat flow serves POST only, so
            # without this there would be nothing a probe could ask.
            - name: admin
              containerPort: 39999
          readinessProbe:
            httpGet:
              # 200 once every connector and flow started, 503 with the reason
              # otherwise — including while a shutdown drains, which is the half
              # that matters here.
              path: /readyz
              port: admin
            # The LLM connector is built at startup; give it room before the first
            # ask, so a rollout does not log a failure it was always going to pass.
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            # Slower than readiness on purpose: readiness taking a pod out of
            # rotation is cheap, restarting it is not — and restarting this one
            # drops whatever conversation was in flight.
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.admin.agent.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: data
              mountPath: /data
            # curl writes where it is told and the runtime writes nothing, but a
            # read-only root leaves a program that reaches for a temporary file
            # with nowhere to put it. Cheap insurance against a failure that would
            # read as the tool being broken.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: admin-agent-data
        - name: tmp
          emptyDir: {}
{{- end }}
