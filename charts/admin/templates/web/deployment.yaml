{{- /*
  Two replicas of this pod cannot deduplicate a token refresh between them
  without somewhere shared to do it. eetr-auth rotates refresh tokens with reuse
  detection, so the failure is not a duplicated request -- it is the whole token
  family revoked and the operator signed out everywhere, at random, under load.

  So this is a render failure rather than a setting that quietly reintroduces
  that. It is the same reasoning as the `required` calls below: fail where
  somebody can read why, rather than in a cluster at 2am.
*/}}
{{- if and (gt (int .Values.admin.web.replicas) 1) (not .Values.admin.web.redis.enabled) }}
{{- fail "admin.web.replicas above 1 requires admin.web.redis.enabled: the token refresh must be coordinated across replicas, or eetr-auth's reuse detection will revoke the operator's token family" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: admin-web
    {{- include "home-lab-admin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.admin.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-web
    spec:
      # Preferred rather than required, for the reason the API's says: `required`
      # on a single-node cluster leaves the second replica Pending forever.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: admin-web
      # The panel reads nothing from the Kubernetes API — it asks admin-api, which
      # holds the read-only ClusterRole. No token is mounted, so a compromise of
      # the browser-facing pod reaches the cluster only through that API.
      automountServiceAccountToken: false
      {{- with .Values.admin.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin-web
          image: {{ include "home-lab-admin.webImage" . | quote }}
          imagePullPolicy: {{ .Values.admin.web.image.pullPolicy }}
          env:
            # The panel's own origin, and the base of the redirect URI eetr-auth
            # must have registered. Auth.js builds the callback from it, so a
            # value that disagrees with the registered URI fails at the callback
            # rather than at sign-in, which is a confusing place to find out.
            - name: AUTH_URL
              value: {{ printf "https://%s" (required "admin.web.hostname is required" .Values.admin.web.hostname) | quote }}
            # Seals the session cookie (JWE), which carries the operator's access
            # and refresh tokens. Rotating it signs everybody out.
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.web.secret.name }}
                  key: {{ .Values.admin.web.secret.authSecretKey }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.web.secret.name }}
                  key: {{ .Values.admin.web.secret.clientSecretKey }}
            # Not secret: the issuer and the client id both travel in every
            # authorization request the browser makes.
            - name: OIDC_ISSUER
              value: {{ required "admin.api.oidc.issuer is required" .Values.admin.api.oidc.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ required "admin.web.clientId is required" .Values.admin.web.clientId | quote }}
            - name: OIDC_PROVIDER_NAME
              value: {{ .Values.admin.web.providerName | quote }}
            {{- with .Values.admin.web.writeEmails }}
            - name: ADMIN_WRITE_EMAILS
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.admin.web.redis.enabled }}
            # Where the replicas agree about a token refresh. Its presence is what
            # switches the coordination on: src/lib/auth/renew.ts builds a
            # coordinator only when REDIS_URL is set, so a deployment without it
            # keeps the in-process behaviour that is correct at one replica.
            - name: REDIS_URL
              value: {{ .Values.admin.web.redis.url | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.web.redis.secret.name }}
                  key: {{ .Values.admin.web.redis.secret.key }}
            {{- end }}
            # In-cluster, so the panel's server talks to the API directly rather
            # than back out through the Gateway.
            - name: ADMIN_API_URL
              value: http://admin-api.{{ .Release.Namespace }}.svc.cluster.local
            {{- if .Values.admin.agent.enabled }}
            # The agent, also in-cluster. The panel is the only thing that reaches
            # it: it has no route of its own, and the operator's token is attached
            # here rather than held by the agent — so this address is the whole of
            # its access control, and it is a server-side variable for that reason.
            #
            # Absent when no agent is deployed, which is what the launcher reads to
            # decide whether to render at all.
            - name: AGENT_URL
              value: http://admin-agent.{{ .Release.Namespace }}.svc.cluster.local
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            # Slower than readiness on purpose: readiness taking a pod out of
            # rotation is cheap, restarting it is not.
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.admin.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          # Next.js writes to both even with nothing to cache, so a read-only root
          # filesystem needs them mounted rather than relaxed.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
