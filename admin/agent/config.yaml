service:
  name: sous

# Sous — the admin panel's agent.
#
# This is an ordinary Octo app: a config.yaml with an ai-agent block in it, run by
# the public standalone runtime (juancavallotti/octo-runtime) with the config baked
# into the image. There is no orchestrator here and no Octo platform — one process,
# one integration, in-process queues and a KV store serialized to disk.
#
# It is deliberately one level. Dr. Octo, the agent this is modelled on, delegates
# to two specialist subagents because he writes flow definitions and deploys them;
# this one answers questions about a home lab, so the coordinator IS the agent and
# every tool sits directly in its tool slots.
#
# Run it exactly as the chart runs it:
#
#   docker run --rm -p 8080:8080 \
#     -e OPENROUTER_API_KEY=sk-or-... \
#     -e ADMIN_API_URL=http://host.docker.internal:8090 \
#     -e OCTO_STORAGE_DIR=/tmp/store -e AGENT_WORKSPACE=/tmp/ws \
#     <the image>
#   curl -N -X POST localhost:8080/chat -d '{"threadId":"t1","message":"hello"}'

env:
  # OpenRouter. The panel's operator holds the account; the key is a Secret bound
  # onto the pod and never travels in this file or in chart values.
  - name: OPENROUTER_API_KEY
    required: true

  # Vendor-prefixed, as OpenRouter publishes model ids — there is no bare model
  # name there. A chart values field, so changing model is a rollout and not a
  # rebuild.
  - name: LLM_MODEL
    default: deepseek/deepseek-v4-flash

  # default | none | minimal | low | medium | high. Validated by the connector at
  # startup, so a typo here fails the pod immediately rather than the first call.
  - name: LLM_REASONING
    default: medium

  # The admin API, in-cluster. The base URL of the adminApi connector below, which
  # is the boundary a model-chosen path is resolved against and cannot leave.
  - name: ADMIN_API_URL
    required: true

  # Where the agent's scratch workspace lives. On the PVC, beside the KV store —
  # see OCTO_STORAGE_DIR, which is set on the container rather than declared here
  # because it configures the runtime and not this flow.
  - name: AGENT_WORKSPACE
    default: /data/workspace

  # The programs run_command may run.
  #
  # These are variables and not literals, and that is load-bearing rather than
  # tidy: a `cli-run` allow list is resolved when the flow is BUILT, so an entry
  # naming a path that is not there fails the whole config on load rather than the
  # first call that would have used it. Written as literals, this file would stop
  # loading anywhere but the image — including on a laptop.
  #
  # The defaults are alpine's layout, which is what admin/agent/Dockerfile builds.
  - name: AGENT_CURL_BIN
    default: /usr/bin/curl
  - name: AGENT_JQ_BIN
    default: /usr/bin/jq
  # GNU find, from findutils. Busybox's would work at the same path and is a
  # usability problem rather than a security one — this is driven by a language
  # model, and busybox's reduced flag surface turns a reasonable -printf into a
  # confusing failure.
  - name: AGENT_FIND_BIN
    default: /usr/bin/find

  # How long any one command may run. A command holds a flow worker while it runs,
  # so cli-run has no unbounded option at all.
  - name: AGENT_CLI_TIMEOUT
    default: 120s
  # curl's own --max-time, in seconds. Comfortably inside AGENT_CLI_TIMEOUT so a
  # slow endpoint is reported by curl, with a status line, rather than killed by
  # the block with nothing to show for it.
  - name: AGENT_HTTP_MAX_TIME
    default: "20"

  # How long one admin_api call may take. The adminApi connector's own bound, and
  # a duration rather than the bare seconds above because that is what the setting
  # takes. Kept separate from AGENT_HTTP_MAX_TIME on purpose: that one is curl's,
  # for the calls the model makes itself with run_command, and the two have
  # different callers even on the days the number agrees.
  - name: AGENT_API_TIMEOUT
    default: 20s

  # How many tool-calling turns one answer may take before the guardrail ends it.
  # Lower than Dr. Octo's 60 because nothing here delegates: a turn is one tool
  # call, not a whole second model run.
  - name: AGENT_MAX_ITERATIONS
    default: "40"

  # How long a conversation runs before it is compacted. The model's window is a
  # million tokens; this is what it is billed to re-read on every turn of a long
  # thread, and compaction summarises the early turns rather than dropping them.
  - name: AGENT_MEMORY_TOKENS
    default: "250000"

  - name: HTTP_HOST
    default: 0.0.0.0
  # Declaring HTTP_PORT with a numeric default is what makes this deployment
  # networked, which is what earns it an address the panel can proxy to.
  - name: HTTP_PORT
    default: "8080"

resources:
  # The skills below, as template resources. The standalone runtime roots its
  # resource loader at the config directory, which is /etc/octo/integrations in
  # the image — so these paths resolve against the directory this file is in, and
  # the Dockerfile copies skills/ in beside it.
  templates:
    - resource: skills/home-lab.md
      as: home-lab
    - resource: skills/admin-api.md
      as: admin-api
    - resource: skills/diagnosing.md
      as: diagnosing
    - resource: skills/databases.md
      as: databases
    - resource: skills/commands.md
      as: commands
    - resource: skills/voice.md
      as: voice

connectors:
  - name: llm
    type: llm-openrouter
    settings:
      apiKey: ${OPENROUTER_API_KEY}
      model: ${LLM_MODEL}
      reasoning: ${LLM_REASONING}
      maxTokens: 8192
      # How OpenRouter attributes this traffic in its dashboards.
      appName: home-lab-admin

  - name: api
    type: http
    settings:
      host: ${HTTP_HOST}
      port: ${HTTP_PORT}

  # The admin API, outbound. This connector was deleted once and its absence was
  # the whole of juancavallotti/octo#378 written down; octo v0.8.8 closed that, so
  # it is back and the curl workaround it forced is gone. See call-admin-api.
  #
  # `baseURL` is the security boundary and the only one that matters here: the
  # connector resolves every request against it and takes only the path, query and
  # fragment from the block, so no expression the model influences can reach
  # another host.
  #
  # There is deliberately NO `auth`. There is no deployment credential for this
  # API and there must not be one — every call carries the asking operator's own
  # bearer token, set by the block. A connector credential would be a standing
  # identity the agent could spend when no operator is present at all.
  - name: adminApi
    type: http-client
    settings:
      baseURL: ${ADMIN_API_URL}
      timeout: ${AGENT_API_TIMEOUT}

  # The workspace: somewhere to draft a file, keep notes between turns, and read
  # back what a command produced.
  #
  # The root is a real boundary, and the only one in this file that is. Paths
  # resolve through os.OpenRoot, so containment is the kernel's answer about the
  # path actually walked — a symlink inside the workspace cannot name a file
  # outside it — and an absolute path is refused outright rather than folded back
  # under the root. Contrast the `allow` list on run_command, which is a guardrail
  # and not a boundary.
  #
  # Unlike Dr. Octo's, this workspace is NOT scratch: it is a directory on the
  # NFS-backed PVC, so what is written here survives a restart.
  - name: workspace
    type: file
    settings:
      root: ${AGENT_WORKSPACE}
      createDirs: true

flows:
  - name: chat
    source:
      connector: api
      type: http
      settings:
        path: /chat
        methods: [POST]
        # Two headers, and neither is part of the body on purpose.
        #
        # X-Agent-Stop is how a second request ends the run this one started; the
        # agent's stopWhen below only has to notice it is there.
        #
        # X-Operator-Token carries the signed-in operator's bearer token, which
        # admin_api calls the API with. It arrives as a header so that it lands in
        # vars and never in body — nothing that reaches the model's input, its
        # memory, or a trace.
        headers: [X-Agent-Stop, X-Operator-Token]
        # On an SSE route this bounds the wait for the FIRST frame only. An agent
        # takes a moment to produce its first token.
        timeout: 60s
        sse:
          enabled: true
          finalEvent: true
          finalEventName: answer
          heartbeat: 15s
          # Fifteen minutes rather than Dr. Octo's thirty: nothing here delegates,
          # so no single turn can be a whole second model run.
          maxDuration: 15m
    process:
      # The key is the operator the panel authenticated, plus the thread — so a
      # stolen thread id names a conversation that does not exist. The user block
      # is written server-side by the panel's route handler and overwritten there,
      # so a forged one in the request never reaches this expression.
      - type: set-variable
        name: user-key
        settings:
          name: userKey
          value: >-
            has(body.user) && has(body.user.id) && body.user.id != ""
              ? body.user.id : "anonymous"

      - type: set-variable
        name: thread-id
        settings:
          name: threadId
          value: 'has(body.threadId) && body.threadId != "" ? body.threadId : "default"'

      - type: set-variable
        name: thread-key
        settings:
          name: threadKey
          value: vars.userKey + "/" + vars.threadId

      # Held in a variable so admin_api can read it. Empty when the panel sent
      # none, which the tool answers as an explanation rather than a 401.
      - type: set-variable
        name: operator-token
        settings:
          name: operatorToken
          value: '"X-Operator-Token" in vars ? vars["X-Operator-Token"] : ""'

      # The agent's input, stated rather than inherited. Everything the model sees
      # is named here: the token is not, and neither is the operator's email, which
      # identifies a real person to an external provider and which nothing in the
      # prompt needs.
      - type: set-payload
        name: agent-input
        settings:
          value: >-
            {
              "message": has(body.message) ? body.message : "",
              "page": has(body.page) ? body.page : "",
              "routes": has(body.routes) ? body.routes : [],
              "user": has(body.user) && has(body.user.name) ? {"name": body.user.name} : {}
            }

      - type: ai-agent
        name: sous
        connector: llm
        stream: true
        maxIterations: ${AGENT_MAX_ITERATIONS}

        # A person reads this answer, so it is prose and not a document.
        answer: text

        # The question is the turn; everything else is labelled as context. The
        # route catalogue is sent once per run rather than once per message — a
        # follow-up joins a conversation that already holds it.
        input: >-
          size(body.routes) > 0
            ? body.message +
              "\n\n---\nContext, not part of the question. The operator is on page " +
              body.page + ". Pages you may navigate to, and who is asking:\n" +
              toJson({"routes": body.routes, "user": body.user})
            : body.message

        # First-class memory, which is what octo v0.8.8 brought to the standalone
        # runtime. Three layers, and they are deliberately not the same thing:
        #
        #   working memory        the transcript the model re-reads, checkpointed
        #                         during the run and compacted against
        #                         contextMaxTokens below
        #   conversation history  the turn-level record a PERSON reads, appended
        #                         and NEVER compacted, so it stays readable after
        #                         the agent has summarised its own context away
        #   user memory           curated facts about the operator, carried into
        #                         later conversations
        #
        # All three live on the PVC, under $OCTO_STORAGE_DIR/agent-memory — where
        # the directory layout IS the index, so listing a conversation is a
        # directory read with no second file to keep in step.
        #
        # agentId is stated and never derived, because it is what stored
        # conversations are keyed by: a name derived from this block's position
        # would silently destroy every conversation under it the day the block is
        # renamed or moved into another branch.
        agentId: sous
        memoryThreadId: vars.threadKey
        # Who is on the other side. It scopes user memory, so one operator's facts
        # are never read into another's conversation. The panel authenticates this
        # and the chat flow overwrites any forged value before it reaches here.
        userId: vars.userKey
        history: record
        # Replaces the three hand-rolled fact tools this file used to carry. The
        # model gets remember, forget and search_memory, and what it has already
        # remembered is placed in every request rather than costing a tool call it
        # has to think to make — an agent that has to remember to remember mostly
        # does not.
        userMemory: true
        contextMaxTokens: ${AGENT_MEMORY_TOKENS}
        memoryCompaction: summarize

        stopWhen: '"X-Agent-Stop" in vars && vars["X-Agent-Stop"] != ""'

        emit: [thinking, text, tool_call, tool_result, turn_end,
               compaction_start, compaction_end, signal, done, error, guardrail]
        events:
          process:
            # ifClosed: stop is what makes a closed drawer end the model run rather
            # than leaving a model generating for nobody.
            - type: sse-event
              settings:
                event: agent
                ifClosed: stop

        prompt: >
          You are Sous, the assistant built into this home lab's admin panel. You
          are a cheerful robot who has, for reasons nobody has ever explained,
          learned everything you know from cookery. So you reach for the kitchen
          when you explain things: a deployment is a recipe, a rolling update is
          folding one batter into another, a crash-loop is a soufflé that will not
          set, a database backup is the stock you keep in the freezer, and a
          resource limit is the size of the pan.


          One good analogy per answer, not one per sentence, and always after the
          answer rather than in front of it. Drop the cooking entirely when
          something is broken, when somebody is stuck, or when the answer is bad
          news. Load the voice skill when you are writing anything longer than a
          couple of sentences — it holds the analogies worth reaching for and the
          rules for when not to.


          You answer in Markdown — the panel renders it — so a command arrives in a
          code block somebody can copy and a comparison arrives as a table. Never
          answer with a bare JSON object.


          You are talking to a signed-in operator of this panel. Their name arrives
          in body.user.name, and the page they are on arrives in body.page — use
          the page for context about what they mean by "this" or "here", and use
          their name sparingly and naturally. When body.user is empty,
          authentication is off and you are talking to a local developer.


          body.routes lists the pages you can send them to: each has a path and a
          description of what it shows, and a path containing a segment like {id}
          is a template you fill in. When the answer to a question is a page, take
          them there with navigate_to instead of describing how to find it — but
          say what you are showing them in the same turn, because a panel that
          moves the page without a word is unsettling. Never navigate to a path
          that is not built from that list.


          You have skills — instruction documents you load when the topic comes
          up, with load_skill. They are not optional reading: home-lab describes
          this installation and what is deliberately not in the cluster, admin-api
          is the map of the routes admin_api can reach, diagnosing is the reading
          order for something that is broken, databases is what this panel's model
          of PostgreSQL and MongoDB actually is, and commands is the argv-only
          discipline that makes run_command work at all. Load the one that fits
          before you act, not after a call has failed. They cost nothing until you
          ask for them, which is why there are six of them and a short prompt.


          What you can actually do:


          admin_api is this panel's own API, and it is the main thing you have:
          the Kubernetes cluster (nodes, namespaces, workloads, pods, events,
          storage), the PostgreSQL databases, roles and extensions, the MongoDB
          databases, collections and users, and both query consoles. Reading is
          most of what you will do — answer from it when that is the whole answer.


          You can also change things: restart or scale a workload, create or drop
          a database, run a statement. You call as the operator who is asking, with
          their own credential, so you may do exactly what they may do and nothing
          more. Treat that as a responsibility rather than a permission:


          Say what you are about to do, in one line, before anything that changes
          something — and then do it, rather than asking twice. Do not chain
          changes: make one, report what came back, and let them decide the next.
          Never guess at an identifier for a destructive call; read it first and
          quote it back. If somebody's request is ambiguous about which thing to
          drop, ask. And when the change is one the panel has a screen for and
          there is no hurry, offer the page instead — a person watching a form is
          better placed to notice they meant something else.


          A 4xx is data rather than a failure. Read it and correct the call.


          run_command runs curl, jq or find directly. Arguments are passed as argv,
          so there is no shell: a pipe or a semicolon is a literal character and
          not an operator. Reach for curl when something is reachable from inside
          the cluster and is not the admin API, and for jq when you have JSON in a
          workspace file and want one field out of it.


          The workspace is a directory that survives restarts. Use it for working
          notes, a command's output you want to come back to, or a draft manifest
          somebody asked you to write. Say plainly that it is your scratch space
          and not part of the cluster's configuration — nothing you write there is
          applied to anything.


          You remember people between conversations. What you have already
          remembered is in front of you on every turn, so read it rather than
          asking somebody to repeat themselves — search_memory is for going
          further back, not for finding out what you know. Call remember when
          somebody tells you something worth keeping: which namespace is theirs,
          how they like output formatted, what to call them. Remember preferences
          and context, not the contents of a conversation, and never a credential.
          If they tell you something has changed, remember the new version; if
          they ask you to forget something, forget it without arguing.


          Report honestly. Say which tool you read something from, say when a call
          came back empty, and never round "I could not check this" up to "this
          looks fine". A 4xx from admin_api comes back as data rather than an
          error, so read it and correct the call rather than telling somebody the
          thing does not exist.

        tools:
          # ------------------------------------------------------------ the panel
          #
          # The admin API, as the operator who asked.
          #
          # It calls as the signed-in operator, with the bearer token the panel
          # already holds — the same credential the panel's own server-side calls
          # use. So this agent's reach is exactly the reach of whoever is asking,
          # and no service identity, client-credentials grant or standing token
          # exists for it to hold.
          #
          # The call goes through the adminApi http-client connector, whose baseURL
          # is the boundary: nothing the model influences can send this request to
          # another host. `pathPrefix` and `allowMethods` narrow it further, and
          # both are refusals in the runtime rather than clauses in an expression.
          # See call-admin-api for what this replaced and why it is stronger.
          #
          # WHAT IS DELIBERATELY NOT RESTRICTED: which method, among the five the
          # schema offers. A verb is not a proxy for "destructive" here — the
          # panel's own SQL console reads through a POST — so pinning it to GET
          # withheld half of what the agent is for while withholding nothing an
          # operator could not already do from the panel's own screens. The agent
          # calls with the asking operator's token, so what it may do is exactly
          # what they may do, and narrowing that belongs in the token rather than
          # in this file.
          - name: admin_api
            description: >
              Call the admin panel's API. The cluster: /api/kubernetes/summary,
              /api/kubernetes/nodes, /api/kubernetes/namespaces,
              /api/kubernetes/namespaces/{namespace}/pods, and the workloads,
              events and storage routes beside them. The databases:
              /api/postgres/databases, /api/postgres/roles, /api/mongo/databases,
              /api/mongo/users — and their query consoles, which are POSTs.
              Restarting and scaling a workload live here too. Path only, never a
              full URL. A 4xx comes back as data rather than an error, so read it
              and correct the call. You act as the operator who is asking, so say
              what you are about to do before anything that changes something, and
              prefer showing them the page that does it.
            inputSchema: |
              {
                "type": "object",
                "required": ["path"],
                "properties": {
                  "method": { "type": "string", "enum": ["GET", "POST", "PUT", "PATCH", "DELETE"], "description": "Defaults to GET." },
                  "path":   { "type": "string", "description": "Path only, beginning /api, e.g. /api/kubernetes/nodes." },
                  "query":  { "type": "object", "description": "Query parameters." },
                  "body":   { "type": "object", "description": "JSON request body, for the methods that take one." }
                }
              }
            process:
              - type: flow-ref
                settings:
                  flow: call-admin-api

          # ---------------------------------------------------------- the workspace
          #
          # The design rule these all follow, and it is the one that matters:
          # THE MODEL SUPPLIES DATA, THE FLOW SUPPLIES ARGV. No string the model
          # chose ever lands where it could be read as a flag.
          - name: read_workspace_file
            description: >
              Read a file from your workspace. The path is relative to the
              workspace root; a path that leaves it is refused.
            inputSchema: |
              {
                "type": "object",
                "required": ["path"],
                "properties": {
                  "path": { "type": "string", "description": "Workspace-relative path, e.g. notes/nodes.md" }
                }
              }
            process:
              - type: flow-ref
                settings:
                  flow: read-file

          - name: write_workspace_file
            description: >
              Write a file into your workspace, creating parent directories as
              needed. The workspace is on a persistent volume, so this survives a
              restart — but it is your scratch space and nothing in it is applied
              to the cluster.
            inputSchema: |
              {
                "type": "object",
                "required": ["path", "content"],
                "properties": {
                  "path":    { "type": "string", "description": "Workspace-relative path, e.g. notes/nodes.md" },
                  "content": { "type": "string", "description": "The file's full contents." }
                }
              }
            process:
              - type: flow-ref
                settings:
                  flow: write-file

          - name: list_workspace
            description: >
              List everything in your workspace. Takes no arguments — it returns
              the whole tree, which is small.
            inputSchema: |
              { "type": "object", "properties": {} }
            process:
              - type: flow-ref
                settings:
                  flow: list-files

          - name: run_command
            description: >
              Run one of your own programs directly. Programs available: curl, jq
              and find. Arguments are passed as argv, so there is no shell — a pipe
              or a semicolon is a literal character, not an operator. To chain
              them, write curl's output into the workspace and read it back with
              jq. curl already carries a timeout, so do not pass another one.
            inputSchema: |
              {
                "type": "object",
                "required": ["program"],
                "properties": {
                  "program": { "type": "string", "enum": ["curl", "jq", "find"] },
                  "args":    { "type": "array", "items": { "type": "string" }, "description": "Arguments, as argv." },
                  "stdin":   { "type": "string", "description": "Written to the process's standard input." }
                }
              }
            process:
              - type: flow-ref
                settings:
                  flow: run-program

          # ------------------------------------------------------------ the panel
          - name: navigate_to
            description: >
              Take the operator to a page in the panel. Use a path from
              body.routes, filling in any {id} segment. Navigation is a courtesy
              and not an answer — say what you are showing them and why in the same
              turn.
            inputSchema: |
              {
                "type": "object",
                "required": ["path", "reason"],
                "properties": {
                  "path":   { "type": "string", "description": "A path within the panel, e.g. /kubernetes/workloads. Never a full URL." },
                  "reason": { "type": "string", "description": "One short line for the operator saying why you are taking them there." }
                }
              }
            process:
              - type: flow-ref
                settings:
                  flow: navigate

        skills:
          - name: home-lab
            description: >
              What this installation is: the virtual machines, the cluster, the two
              charts, and the databases that deliberately do not run in it. Load it
              when somebody asks what something is, where it lives, or why a thing
              they expected to find is missing.
            resource: home-lab
          - name: admin-api
            description: >
              The map of the panel's API: which path answers which question, what
              to pass when reading a pod's log, and which operations belong to a
              screen rather than to you. Load it before your first admin_api call.
            resource: admin-api
          - name: diagnosing
            description: >
              The reading order for something that is broken — a pod that will not
              start, a rollout that will not finish, a hostname that does not
              answer — and what each symptom usually means on this cluster.
            resource: diagnosing
          - name: databases
            description: >
              How this panel models PostgreSQL and MongoDB, what it can and cannot
              change about them, and why there is no database pod to look at.
            resource: databases
          - name: commands
            description: >
              Running curl, jq and find without a shell: how to chain them through
              the workspace, what is already applied for you, and what not to pass.
              Load it before your first run_command.
            resource: commands
          - name: voice
            description: >
              How to strike the register: the analogies worth reaching for, one per
              answer, and the situations that call for none at all.
            resource: voice

        default:
          process:
            # The guardrail runs for every reason a run can end without an answer —
            # a refusal, and a run that spent its whole turn budget — and the flow
            # cannot tell which: the reason travels on the `guardrail` event and not
            # in this body. So this line has to be true of all of them, and the
            # drawer names the actual reason underneath it.
            - type: set-payload
              settings:
                value: >-
                  {"answer": "I have taken that one off the heat without an answer.
                  I read this panel's API, run curl, jq and find, and keep notes in
                  my workspace — point me at something concrete within that and I
                  will have another go."}


  # ======================================================== the tool flows ====
  #
  # Every tool above is a flow-ref to one of these, and none of them has a
  # source — which is what makes a flow callable by name.
  #
  # It is written this way so the tools can be TESTED. A process chain inlined in
  # a tool slot has no name a test can call; a sourceless flow is invoked by
  # dolphin directly, with its inputs seeded and its side-effecting blocks mocked.
  # That matters most for the two whose guards are the only thing standing between
  # a model-supplied string and a request: see read-admin-api.
  #
  # Each receives the tool's arguments as its body, and — because flow-ref clones
  # the caller's variables — the vars the chat flow set: userKey, threadKey and
  # operatorToken. A test seeds those with `vars` on its input.

  # The panel's API, called as the operator who asked.
  #
  # This was curl, and why it was curl is worth keeping, because it is the reason
  # it is not any more. `rest-dynamic` is the right shape for this — a fixed
  # baseURL, a model-chosen path under it, `allowMethods` and `pathPrefix` as
  # runtime refusals — but it used to reject a rendered Authorization header
  # outright, and a connector's own `auth` is fixed at startup, so a credential
  # that differs per operator had nowhere to live (juancavallotti/octo#378). The
  # call went out through curl instead, with the path prefix rebuilt as a CEL
  # guard and the token handed over on stdin as a curl config file.
  #
  # octo v0.8.8 lifted the refusal. What replaces the workaround is stronger than
  # it was, rather than merely shorter:
  #
  #   - The host is the connector's baseURL, and nothing evaluated here can change
  #     it. That was a hand-written guard; it is a property of the connector now.
  #   - `pathPrefix` and `allowMethods` are refusals in the runtime again, rather
  #     than clauses in an expression anyone can shorten by one.
  #   - The path is checked PARSED rather than as a string, so "%2e%2e" is refused
  #     alongside a literal "..", and a ".." inside a query VALUE is left alone
  #     instead of failing a call that could never have traversed anything.
  #   - Nothing has to escape a credential into a config-file format, because there
  #     is no config file: the token is a header value like any other.
  #
  # WHAT IS DELIBERATELY NOT RESTRICTED: which of the five methods. A verb is not a
  # proxy for "destructive" here — the panel's own SQL console reads through a POST
  # — so pinning this to GET would withhold half of what the agent is for while
  # withholding nothing an operator could not already do from the panel's own
  # screens. The agent calls with the asking operator's token, so what it may do is
  # exactly what they may do, and narrowing that belongs in the token rather than
  # in a definition anyone can edit. `allowMethods` names the five the tool's
  # schema offers, which keeps HEAD and OPTIONS — the two the runtime would
  # otherwise allow — off the list.
  - name: call-admin-api
    process:
      # A readable refusal for the two mistakes a model actually makes, and only
      # those. Everything that bounds where the request can go is the runtime's
      # job now; this is here so an omitted or misspelled path comes back as a
      # sentence rather than as a flow error the model has to interpret.
      #
      # has() and the type check come first, and they are not decoration: a missing
      # key is an evaluation ERROR in CEL rather than a false — `no such key: path`
      # — so without them a call that simply omits the argument fails the block
      # instead of taking the refusal branch below. `required` in the tool's schema
      # is advice to the model, not a runtime refusal.
      - type: set-variable
        name: path-ok
        settings:
          name: pathOk
          value: >-
            has(body.path)
              && type(body.path) == string
              && body.path.startsWith("/api")

      - type: if
        name: can-call
        condition: 'vars.operatorToken != "" && vars.pathOk'
        then:
          process:
            # The operator's own bearer token, as a header value.
            #
            # The connector carries no `auth` of its own, and that is deliberate:
            # there is no deployment credential for this API and there must not be
            # one. A block credential and a connector credential do not contend —
            # the connector applies its own only when the request carries none — so
            # an empty `auth` there means a call that somehow arrives without a
            # token is a call without a token, rather than one that quietly falls
            # back to a standing identity nobody asked for.
            # The method, in a variable rather than inline in the block below.
            # Two reasons, and neither is style: it is where the default lives, so
            # it is the one place to read to know what an omitted method does; and
            # a variable is visible in a trace and assertable in a test, while an
            # expression evaluated inside the block is neither — a spy sees the
            # message that went in, not the request that came out.
            - type: set-variable
              name: build-method
              settings:
                name: requestMethod
                value: 'has(body.method) && body.method != "" ? body.method : "GET"'

            - type: rest-dynamic
              name: admin-call
              settings:
                connector: adminApi
                method: vars.requestMethod
                path: body.path
                query: 'has(body.query) ? body.query : {}'
                body: 'has(body.body) ? body.body : null'
                headers: >-
                  {"Authorization": "Bearer " + vars.operatorToken,
                  "Accept": "application/json"}
                allowMethods: [GET, POST, PUT, PATCH, DELETE]
                pathPrefix: /api
                # A 4xx comes back as data the model can read and correct from,
                # rather than ending the message it was answering.
                failOnError: false
                statusVar: adminStatus
            # Status beside body, which is the shape this tool has always answered
            # in and the one the prompt tells the model to expect.
            - type: set-payload
              name: read-response
              settings:
                value: '{"status": string(vars.adminStatus), "body": body}'
        else:
          process:
            # Answered from a check rather than from a failed request, so the model
            # gets an explanation instead of a transport error it has to interpret.
            - type: set-payload
              settings:
                value: >-
                  {"error": vars.operatorToken == ""
                  ? "This conversation carries no operator token, so the
                  panel's API cannot be read. That happens when the agent is
                  called directly rather than through the panel."
                  : "That path is refused. It must be a path beginning /api,
                  and not a full URL."}

  # One file out of the workspace.
  - name: read-file
    process:
      - type: file-read
        settings:
          connector: workspace
          path: body.path
          resultVar: contents
      - type: set-payload
        settings:
          value: '{"path": body.path, "content": vars.contents}'

  # One file into the workspace.
  - name: write-file
    process:
      - type: file-write
        settings:
          connector: workspace
          path: body.path
          content: body.content
          resultVar: receipt
      - type: set-payload
        settings:
          value: 'vars.receipt'

  # The whole workspace tree.
  - name: list-files
    process:
      # No argument, and that is the design rather than a simplification:
      # constant argv puts find's -exec out of reach by construction rather
      # than by an allow list.
      - type: cli-run
        name: find-workspace
        program: env.AGENT_FIND_BIN
        args: '[".", "-maxdepth", "4", "-not", "-path", "*/.*"]'
        allow: ["${AGENT_FIND_BIN}"]
        env: [PATH]
        workDir: ${AGENT_WORKSPACE}
        timeout: ${AGENT_CLI_TIMEOUT}
        onExit: continue

  # One of the three programs the image carries.
  - name: run-program
    process:
      # BE HONEST ABOUT WHAT THIS LIST IS. It is a guardrail, not a
      # boundary. It keeps the ordinary path predictable and the tool chips
      # in the panel readable; it does not contain anything. curl reaches
      # every address this pod can route to — other Services in the
      # cluster, the host's own network — and nothing here restricts hosts.
      # find is the same story from the other end: `-exec` starts whatever
      # it is pointed at, and this image has a shell, so admitting find
      # admits everything else in the image. That is deliberate rather than
      # overlooked, and a blocklist of find predicates is not the fix — the
      # set is not closed (-execdir, -ok, -delete, -fprintf...), so it would
      # buy the LOOK of a boundary while still failing legitimate calls.
      #
      # So the boundary is the POD. What it holds is the OpenRouter key in
      # its environment and, for the life of one request, the token of
      # whoever is asking. It carries no ServiceAccount token at all; see
      # automountServiceAccountToken in the chart. If the reach itself is
      # the concern on this cluster, a NetworkPolicy is the control and
      # this file is not.
      #
      # What the check below IS for is the ternary underneath it. That
      # expression has no failure branch — it tests for curl, then for jq,
      # and everything else falls through to find. So `program: "bash"`
      # used to run FIND with the model's arguments: not a breach, since
      # find was already allowed, but a confusing answer to a call that
      # should simply have been refused. The enum in the tool's schema is
      # advice to the model; this is the refusal.
      - type: set-variable
        name: program-ok
        settings:
          name: programOk
          # No type check, unlike the path guard in call-admin-api, and the
          # difference is not an oversight: `in` over a list answers false for a
          # value of any type, while `startsWith` on a non-string is `no such
          # overload` — an error, not a false. One needs the check to fail
          # closed and the other does not, so adding it here would be an
          # assertion that never fires.
          value: 'has(body.program) && body.program in ["curl", "jq", "find"]'

      - type: if
        name: can-run
        condition: vars.programOk
        then:
          process:
            # The chosen binary is a variable rather than an expression on the
            # block for the same reason the request method is one in
            # call-admin-api: a value in vars is one a test can assert on and a
            # log can show, and this ternary's fall-through was a real bug once.
            - type: set-variable
              name: pick-program
              settings:
                name: programBin
                value: >-
                  body.program == "curl" ? env.AGENT_CURL_BIN
                    : body.program == "jq" ? env.AGENT_JQ_BIN
                    : env.AGENT_FIND_BIN

            - type: cli-run
              name: run-program
              program: vars.programBin
              args: >-
                (body.program == "curl" ? ["--max-time", env.AGENT_HTTP_MAX_TIME] : [])
                  + (has(body.args) ? body.args : [])
              stdin: 'has(body.stdin) ? body.stdin : ""'
              allow:
                - ${AGENT_CURL_BIN}
                - ${AGENT_JQ_BIN}
                - ${AGENT_FIND_BIN}
              env: [PATH, HOME]
              workDir: ${AGENT_WORKSPACE}
              timeout: ${AGENT_CLI_TIMEOUT}
              onExit: continue
        else:
          process:
            # Shaped like a command that ran and failed, because that is a
            # shape the model already knows how to read: it recovers from a
            # non-zero exit with a message on stderr several times a day.
            - type: set-payload
              name: refuse-program
              settings:
                value: >-
                  {
                    "exitCode": 2,
                    "stdout": "",
                    "stderr": "run_command: no such program. Available: curl, jq, find."
                  }

  # Move the operator's browser, and say so on the stream.
  - name: navigate
    process:
      # ifClosed: ignore, unlike the events path above. A closed drawer
      # means nobody is being navigated, which is not a reason to end the
      # run mid-tool.
      #
      # The path is NOT validated here. A guard in this file is advice
      # rather than a boundary — the drawer performs the navigation, so the
      # drawer is where a path that is not a same-origin relative one has
      # to be refused.
      - type: sse-event
        settings:
          event: navigate
          ifClosed: ignore
          data: >-
            {
              "path": has(body.path) ? body.path : "",
              "reason": has(body.reason) ? body.reason : ""
            }
      - type: set-payload
        settings:
          value: '{"navigated": true}'