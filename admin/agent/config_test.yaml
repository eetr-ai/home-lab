# call-admin-api: the path guard, the request it hands the block, and the reply it
# reads back.
#
# WHAT THIS SUITE COVERS IS SMALLER THAN IT WAS, and the reason is the point. The
# tool used to be curl, because `rest-dynamic` refused a rendered Authorization
# header and a connector's own auth is fixed at startup, so a per-operator
# credential had nowhere to go (juancavallotti/octo#378). Everything that bounded
# the request was therefore a CEL guard in the flow — a prefix check, a
# protocol-relative check, a `..` check, a scheme check, a whitespace check — and
# every one of them needed a case here, because a clause dropped from an
# expression is silent.
#
# octo v0.8.8 lifted the refusal, so the bounding went back to the runtime:
# the connector's `baseURL` fixes the host, and `pathPrefix` and `allowMethods`
# refuse on the parsed path before a request is made. Those are not testable from
# here — the block is mocked, so its checks never run — and they should not be:
# they are octo's, tested in its own restdynamic_test.go, against the parsed path
# rather than a string, which is why "%2e%2e" and a `..` in a query VALUE now get
# the right answers where the CEL version got one of them wrong.
#
# So the coverage moved rather than vanished, and it moved in two directions:
#   - that those settings are PRESENT is asserted by lint.sh, which fails if
#     pathPrefix, allowMethods or failOnError is dropped, or if the connector
#     grows an `auth` of its own;
#   - that they WORK is octo's suite.
# What is left here is what is still this file's job: the refusal branch, which
# exists so a model gets a sentence rather than a flow error; the shape of the
# answer the tool gives back; and the transport failure, which `failOnError` does
# NOT cover and which needed a wrapper to stay a sentence.
#
# The METHOD is deliberately unrestricted among the five the schema offers, and
# there is no case asserting otherwise. A verb is not a proxy for "destructive"
# here — the panel's SQL console reads through a POST — and the agent calls with
# the asking operator's own token, so what it may do is what they may do.
flow: call-admin-api
timeout: 30s

env:
  # Declared required by the definition, so the whole config refuses to load
  # without it — every case, not only one that would reason. No case here makes a
  # model call; this is what lets the config load at all.
  OPENROUTER_API_KEY: not-used-by-this-suite
  ADMIN_API_URL: http://admin-api.test.invalid
  AGENT_WORKSPACE: /tmp
  AGENT_CLI_TIMEOUT: 120s

# The token is a variable rather than part of the body, which is the whole point of
# it arriving on a header — so every case seeds it the way the chat flow would.
inputs:
  nodes:
    data: { path: /api/kubernetes/nodes }
    vars: { operatorToken: test-token }
  with query:
    data: { path: /api/kubernetes/namespaces/admin/pods, query: { container: web } }
    vars: { operatorToken: test-token }

# No case reaches the network. A hole here is an error rather than a real request,
# which is what makes "nothing in this file calls anything" true rather than hoped.
#
# The address names every composite on the way in, because a target under one has
# to be reached through it: the `if`'s `then`, then the `handle-errors` block's
# `process`. It grew a segment when the call was wrapped to catch a transport
# failure, which is worth knowing because a stale address here does not fail — it
# mocks nothing, and the case makes a real request.
#
# `vars` on a mock is how a block that reports through one is stood in for —
# rest-dynamic writes its status to `statusVar`, so a mock that supplies only a
# body would leave the status unset and every case reading it would be asserting
# against nothing.
mocks:
  call-admin-api.can-call[then].attempt-call[process].admin-call:
    default:
      body: { items: [] }
      vars: { adminStatus: 200 }

cases:
  - name: a path under /api is called, as the operator who asked
    input: nodes
    expect:
      body:
        status: "200"
        body: { items: [] }
    spies:
      call-admin-api.can-call[then].attempt-call[process].admin-call:
        count: 1
        records:
          - input:
              that:
                - 'body.path == "/api/kubernetes/nodes"'
                # No method given, so it is a GET. The default lives in the flow
                # rather than in the schema, and this is what says so — the reason
                # it is a variable at all is that an expression evaluated inside
                # the block would not be visible here.
                - 'vars.requestMethod == "GET"'
                # The credential reaches the block that spends it. Where it goes
                # from there is the block's business: it renders the Authorization
                # header, and lint.sh is what pins that this is the only place the
                # raw token is named.
                - 'vars.operatorToken == "test-token"'

  # The panel's SQL console is a POST that only reads, which is the whole reason
  # the method is the model's to choose.
  - name: a POST carries its method and its JSON body through
    input:
      data:
        method: POST
        path: /api/postgres/databases/app/query
        body: { sql: 'select "id" from t where name = ''x''' }
      vars: { operatorToken: test-token }
    expect:
      that: ['body.status == "200"']
    spies:
      call-admin-api.can-call[then].attempt-call[process].admin-call:
        count: 1
        records:
          - input:
              that:
                - 'vars.requestMethod == "POST"'
                # Handed over as a structure rather than a string. Nothing escapes
                # it into a config-file format any more, which is one whole class
                # of bug — a quote ending a value early — that stopped existing
                # with the curl workaround.
                - 'body.body.sql.contains("select")'

  - name: a DELETE is issued as one
    input:
      data: { method: DELETE, path: /api/postgres/databases/scratch }
      vars: { operatorToken: test-token }
    expect:
      that: ['body.status == "200"']
    spies:
      call-admin-api.can-call[then].attempt-call[process].admin-call:
        count: 1
        records:
          - input:
              that: ['vars.requestMethod == "DELETE"']

  - name: query parameters reach the block
    input: with query
    expect:
      that: ['body.status == "200"']
    spies:
      call-admin-api.can-call[then].attempt-call[process].admin-call:
        count: 1
        records:
          - input:
              that: ['body.query.container == "web"']

  # failOnError is false on the block, so a 4xx arrives as a message rather than
  # ending the flow. This asserts the shape the model then reads: a status beside
  # a body, both readable, so it can correct the call rather than being told the
  # thing does not exist.
  - name: a 404 comes back as data the model can read
    input: nodes
    mocks:
      call-admin-api.can-call[then].attempt-call[process].admin-call:
        default:
          body: { error: "no such namespace" }
          vars: { adminStatus: 404 }
    expect:
      body:
        status: "404"
        body: { error: "no such namespace" }

  # The API not answering at all, which is ordinary rather than exotic: a rollout,
  # or a pod not up yet. `failOnError: false` does NOT cover this — it governs the
  # status, and this is a request that never got one, so the block returns an
  # error and the chain stops. Without the handle-errors wrapper the tool call
  # ends as a dead message and the model gets a transport error to interpret.
  #
  # Asserted on all three keys rather than on the error alone: an empty status is
  # what distinguishes "no reply" from a 4xx, and the model is told to treat those
  # differently — correct the call, versus report that the panel's API is down.
  - name: the API being unreachable is a sentence, not a dead message
    input: nodes
    mocks:
      call-admin-api.can-call[then].attempt-call[process].admin-call:
        default:
          error: dial tcp 10.0.0.1:80 connect connection refused
    expect:
      that:
        - 'body.error.contains("the request could not be made")'
        - 'body.error.contains("connection refused")'
        - 'body.status == ""'
        - 'body.body == ""'

  # ---------------------------------------------------------------- the guard
  #
  # What is left of it. It bounds nothing the runtime does not bound better; it is
  # here so the two mistakes a model actually makes come back as a sentence rather
  # than as a flow error it has to interpret. The spy count of 0 is the assertion
  # that matters — it says no request was made, rather than that the answer looked
  # wrong.
  - name: a path outside /api is refused
    input:
      data: { path: /healthz }
      vars: { operatorToken: test-token }
    expect:
      that: ['body.error.contains("refused")']
    spies:
      call-admin-api.can-call[then].attempt-call[process].admin-call: { count: 0 }

  # Refused here rather than by the runtime, and worth its own case for that
  # reason: "//evil.example/api" does not start with "/api", so the guard answers
  # it with a sentence. Had it reached the block, the runtime would have refused it
  # too — url.Parse reads "//host" as a host — so this is belt and braces on the
  # one shape that looks most like a path and is not.
  - name: a protocol-relative path is refused before the block
    input:
      data: { path: "//evil.example/api" }
      vars: { operatorToken: test-token }
    expect:
      that: ['body.error.contains("refused")']
    spies:
      call-admin-api.can-call[then].attempt-call[process].admin-call: { count: 0 }

  # A missing key is an evaluation ERROR in CEL rather than a false — `no such
  # key: path`. So without the presence check these two failed the block instead
  # of taking the refusal branch, and the model got a transport error to interpret
  # where it should have got a sentence it could act on. `required` in the tool's
  # inputSchema is advice to the model, not a runtime refusal.
  - name: a call with no path at all is refused, not an evaluation error
    input:
      data: { method: GET }
      vars: { operatorToken: test-token }
    expect:
      that: ['body.error.contains("refused")']
    spies:
      call-admin-api.can-call[then].attempt-call[process].admin-call: { count: 0 }

  - name: a path that is not a string is refused
    input:
      data: { path: 42 }
      vars: { operatorToken: test-token }
    expect:
      that: ['body.error.contains("refused")']
    spies:
      call-admin-api.can-call[then].attempt-call[process].admin-call: { count: 0 }

  # Not a guard but the same shape: the agent called directly, outside the panel,
  # has no operator to act as. Answered from a check so the model gets a sentence
  # rather than a transport error to interpret — and never from a connector
  # credential, because the connector deliberately carries none.
  - name: no operator token means no call at all
    input:
      data: { path: /api/kubernetes/nodes }
      vars: { operatorToken: "" }
    expect:
      that: ['body.error.contains("no operator token")']
    spies:
      call-admin-api.can-call[then].attempt-call[process].admin-call: { count: 0 }
