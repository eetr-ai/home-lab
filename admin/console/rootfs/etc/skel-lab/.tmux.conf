# The console's default .tmux.conf. Copied into the home volume on first start
# and never again, so this copy is yours to change.

set -g default-shell /bin/zsh
set -g mouse on
set -g history-limit 50000

# ttyd's xterm.js speaks 256 colours and truecolor; tell tmux so, and tell what
# runs inside it.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on

set -g status-interval 5
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[fg=colour46,bold] #S #[default]"
set -g status-left-length 40
set -g status-right "#[fg=colour244]%Y-%m-%d %H:%M "
setw -g window-status-current-style "fg=colour231,bg=colour238,bold"
