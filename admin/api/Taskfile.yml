version: '3'

# Tasks for the admin API module. Included from the root Taskfile under the
# `admin-api:` namespace with the working directory set to admin/api, so every
# path here is relative to it.

vars:
  GO: go
  # Pinned, and run through `go run` rather than installed, for two reasons: every
  # machine and CI resolve the same linter, and it is compiled by the toolchain
  # that builds this module. A separately installed binary built by an older Go
  # refuses to load a config targeting a newer language version.
  GOLANGCI_VERSION: v2.13.1

tasks:
  fmt:
    desc: Format the module
    cmds:
      - '{{.GO}} fmt ./...'

  build:
    desc: Build the admin-api binary into admin/api/bin
    cmds:
      - mkdir -p bin
      - '{{.GO}} build -trimpath -o bin/admin-api .'

  test:
    desc: 'Run the tests (pass go test flags after --, e.g. task admin-api:test -- -race)'
    cmds:
      # CLI_ARGS lands before the package list so `-race` and friends are read as
      # flags rather than package names.
      - '{{.GO}} test {{.CLI_ARGS}} ./...'

  lint:
    desc: Run golangci-lint over the module
    cmds:
      - '{{.GO}} run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_VERSION}} run ./...'

  vet:
    desc: Run go vet over the module
    cmds:
      - '{{.GO}} vet ./...'

  tidy:
    desc: Tidy the module
    cmds:
      - '{{.GO}} mod tidy'

  run:
    desc: Run the API locally (set PORT to override 8090)
    cmds:
      - '{{.GO}} run . {{.CLI_ARGS}}'
