version: '3'

# Tasks for the admin API module. Included from the root Taskfile under the
# `admin-api:` namespace with the working directory set to admin/api, so every
# path here is relative to it.

vars:
  GO: go
  # Pinned so every machine and CI regenerate byte-identical output. Bumping this
  # is expected to move internal/openapi/swagger.json; commit both together.
  #
  # v2 is what emits OpenAPI 3.1, and rc5 is the newest published tag. Depending on
  # a release candidate is tolerable precisely because the output is committed: the
  # generator runs in CI and on developer machines, never in the running service,
  # so the worst a bad release does is fail this task.
  SWAG_VERSION: v2.0.0-rc5
  # Pinned, and run through `go run` rather than installed, for two reasons: every
  # machine and CI resolve the same linter, and it is compiled by the toolchain
  # that builds this module. A separately installed binary built by an older Go
  # refuses to load a config targeting a newer language version.
  GOLANGCI_VERSION: v2.13.1

tasks:
  openapi:
    desc: Regenerate the embedded OpenAPI description from the handler annotations
    # JSON only, on purpose. swag can also emit a Go package, but importing it
    # would put the generator in the module's dependency graph and give the binary
    # a second copy of the spec that could disagree with the committed one.
    # Generating the artifact and embedding it keeps swaggo a tool, not a dependency.
    cmds:
      - '{{.GO}} run github.com/swaggo/swag/v2/cmd/swag@{{.SWAG_VERSION}} init --v3.1 --quiet --generalInfo internal/openapi/doc.go --dir ./ --parseInternal --outputTypes json --output internal/openapi'

  openapi:check:
    desc: Fail if the checked-in OpenAPI description is out of date
    cmds:
      # Compares the file against what regeneration produces, rather than against
      # git. Asking git would report any uncommitted edit as drift, which fails on
      # a branch that legitimately has new routes not yet committed — the check
      # would then be about commit state instead of about whether the description
      # matches the annotations.
      - |
        set -eu
        before=$(mktemp)
        trap 'rm -f "$before"' EXIT
        cp internal/openapi/swagger.json "$before"
        task openapi
        if ! diff -q "$before" internal/openapi/swagger.json >/dev/null; then
          printf 'The OpenAPI description does not match the handler annotations.\n' >&2
          printf 'It has been regenerated; review and commit internal/openapi/swagger.json.\n' >&2
          exit 1
        fi

  fmt:
    desc: Format the module
    cmds:
      - '{{.GO}} fmt ./...'

  build:
    desc: Build the admin-api binary into admin/api/bin
    cmds:
      - mkdir -p bin
      - '{{.GO}} build -trimpath -o bin/admin-api .'

  test:
    desc: 'Run the tests (pass go test flags after --, e.g. task admin-api:test -- -race)'
    cmds:
      # CLI_ARGS lands before the package list so `-race` and friends are read as
      # flags rather than package names.
      - '{{.GO}} test {{.CLI_ARGS}} ./...'

  lint:
    desc: Run golangci-lint over the module
    cmds:
      - '{{.GO}} run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_VERSION}} run ./...'

  vet:
    desc: Run go vet over the module
    cmds:
      - '{{.GO}} vet ./...'

  tidy:
    desc: Tidy the module
    cmds:
      - '{{.GO}} mod tidy'

  run:
    desc: Run the API locally (set PORT to override 8090)
    cmds:
      - '{{.GO}} run . {{.CLI_ARGS}}'
