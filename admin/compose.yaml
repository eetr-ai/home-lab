name: home-lab-admin

# The local development stack: the API and the panel, built from the same
# Dockerfiles that ship, wired to whatever `admin/.env` points at.
#
#   task dev     bring it up
#   task stop    take it down
#
# It is meant to run against the real services — the host's PostgreSQL and
# MongoDB, and the real eetr-auth — because the parts most worth testing (SCRAM
# verifiers, OIDC discovery, token refresh) have nothing to prove against a fake.
# Everything that names one of those lives in admin/.env, which is not committed.
#
# The cluster section is off by default: reading it needs either a ServiceAccount
# or a kubeconfig, and a container has neither. Mount one in if you want it — see
# the commented block on the api service.
#
# All three services come up together, so `admin/.env` needs an OPENROUTER_API_KEY
# as well — `task dev` says so rather than starting a stack with a dead assistant
# in it. In the cluster the agent is a deliberate opt-in; locally it is part of
# the thing you are working on.

services:
  api:
    build:
      context: ./api
    environment:
      ADMIN_OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER in admin/.env}
      ADMIN_OIDC_AUDIENCE: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID in admin/.env}
      ADMIN_POSTGRES_DSN: ${ADMIN_POSTGRES_DSN:-}
      ADMIN_POSTGRES_QUERY_DSN: ${ADMIN_POSTGRES_QUERY_DSN:-}
      ADMIN_MONGO_URI: ${ADMIN_MONGO_URI:-}
      ADMIN_KUBERNETES_DISABLED: ${ADMIN_KUBERNETES_DISABLED:-true}
      ADMIN_KUBERNETES_NODE_STATS: ${ADMIN_KUBERNETES_NODE_STATS:-false}
    ports:
      # Published as well as reachable on the compose network, so `npm run dev`
      # in admin/web can talk to this API without the panel container running.
      - "8090:8090"
    # To read the cluster locally, set ADMIN_KUBERNETES_DISABLED=false and mount a
    # kubeconfig. It carries a credential, so it is read-only and never copied in:
    #   volumes:
    #     - ${HOME}/.kube/config:/home/nonroot/.kube/config:ro
    #   environment:
    #     KUBECONFIG: /home/nonroot/.kube/config
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: ./web
    environment:
      # Auth.js seals the session cookie with this. Any long random string will
      # do locally, but it must not change between restarts or every session is
      # invalidated at once.
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in admin/.env — generate one with `openssl rand -base64 32`}
      # The panel's own origin, and the base of the redirect URI eetr-auth must
      # have registered: ${AUTH_URL}/api/auth/callback/eetr.
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER in admin/.env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID in admin/.env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in admin/.env}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Eetr Auth}
      ADMIN_WRITE_EMAILS: ${ADMIN_WRITE_EMAILS:-}
      # Service name, not localhost: this call is made by the panel's server, which
      # is inside the compose network.
      ADMIN_API_URL: http://api:8090
      # Unset unless the agent profile is up, which is what makes the launcher
      # render nothing — the same signal the chart gives it in the cluster.
      AGENT_URL: ${AGENT_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

  # The assistant. The one service here that spends money to answer, which is why
  # the chart leaves it off by default and why `task dev` checks for a key before
  # bringing the stack up at all.
  agent:
    build:
      context: ./agent
    environment:
      # `:-` and not `:?`, which would be the obvious choice and is wrong here:
      # compose interpolates the whole file before it selects profiles, so a
      # required variable on this service would fail a plain `task dev` that never
      # wanted the agent. Octo declares it required and says so at startup, which
      # is a clearer message anyway and only reaches somebody who asked for this.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-v4-flash}
      LLM_REASONING: ${LLM_REASONING:-medium}
      # Service name, not localhost: the agent calls the API from inside the
      # compose network, exactly as it does from inside the cluster.
      ADMIN_API_URL: http://api:8090
      # The two halves of the volume below. In the cluster these are one NFS claim;
      # here they are one named volume, so a restart keeps the conversation and the
      # workspace the same way a rescheduled pod does.
      AGENT_WORKSPACE: /data/workspace
      OCTO_STORAGE_DIR: /data/store
    volumes:
      - agent-data:/data
    ports:
      # Loopback only, unlike the other two. They are published on every interface
      # because each refuses an anonymous caller — the API wants a bearer token and
      # the panel wants a session. This one has no authentication of its own: the
      # panel attaching the operator's token is the whole of its access control, so
      # anything that can reach this port can spend the provider key.
      #
      # Published at all so `npm run dev` in admin/web can reach it on
      # AGENT_URL=http://localhost:8080 without the panel container running.
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

volumes:
  agent-data:
