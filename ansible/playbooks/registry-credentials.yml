---
# Install or rotate the private registry credentials on every node.
#
# Separate from bootstrap.yml so a rotation does not mean rerunning the whole
# cluster build:
#
#   ansible-playbook playbooks/registry-credentials.yml \
#     -e registry_credentials_file=/absolute/path/to/key.json
- name: Configure private registry access
  hosts: kubernetes
  become: true
  # One node at a time. Installing the credential restarts the kubelet, and while
  # that does not disturb running containers, rolling it keeps the cluster from
  # having every node's kubelet down in the same instant.
  serial: 1
  roles:
    - registry_credentials
