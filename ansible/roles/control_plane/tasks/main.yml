---
- name: Verify there is exactly one control-plane node
  ansible.builtin.assert:
    that:
      - groups['control_plane'] | length == 1
    fail_msg: This bootstrap currently supports exactly one control-plane node.
  run_once: true

- name: Verify encryption-key inputs and backup acknowledgement
  ansible.builtin.assert:
    that:
      - encryption_key_file | length > 0
      - encryption_key_file is match('^/')
      - encryption_key_backup_confirmed | bool
    fail_msg: >-
      Supply an absolute encryption_key_file outside the repository and pass
      encryption_key_backup_confirmed=true only after storing a recoverable copy.
  delegate_to: localhost
  become: false
  no_log: true

- name: Inspect the encryption-key file on the operator machine
  ansible.builtin.stat:
    path: "{{ encryption_key_file }}"
  register: encryption_key_stat
  delegate_to: localhost
  become: false
  no_log: true

- name: Verify encryption-key ownership mode and exact size
  ansible.builtin.assert:
    that:
      - encryption_key_stat.stat.exists
      - encryption_key_stat.stat.isreg
      - encryption_key_stat.stat.mode == "0600"
      - encryption_key_stat.stat.size == 32
    fail_msg: The encryption key must be a mode-0600 regular file containing exactly 32 bytes.
  delegate_to: localhost
  become: false
  no_log: true

- name: Read the encryption key without exposing it
  ansible.builtin.slurp:
    src: "{{ encryption_key_file }}"
  register: encryption_key_content
  delegate_to: localhost
  become: false
  no_log: true

- name: Create the API-server encryption directory
  ansible.builtin.file:
    path: "{{ encryption_config_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Check whether the control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: control_plane_admin_config

- name: Check whether the supplied key matches an initialized control plane
  ansible.builtin.template:
    src: encryption-config.yaml.j2
    dest: "{{ encryption_config_path }}"
    owner: root
    group: root
    mode: "0600"
  check_mode: true
  register: initialized_encryption_key_check
  when: control_plane_admin_config.stat.exists
  no_log: true

- name: Refuse implicit encryption-key rotation
  ansible.builtin.assert:
    that:
      - not initialized_encryption_key_check.changed
    fail_msg: >-
      The supplied encryption key does not match the initialized cluster.
      Restore the original key; key rotation requires a separate migration runbook.
  when: control_plane_admin_config.stat.exists
  no_log: true

- name: Install the API-server encryption configuration
  ansible.builtin.template:
    src: encryption-config.yaml.j2
    dest: "{{ encryption_config_path }}"
    owner: root
    group: root
    mode: "0600"
  when: not control_plane_admin_config.stat.exists
  no_log: true

- name: Write the kubeadm v1beta4 initialization configuration
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    owner: root
    group: root
    mode: "0600"

- name: Initialize the Kubernetes control plane
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - --config
      - /etc/kubernetes/kubeadm-config.yaml
  args:
    creates: /etc/kubernetes/admin.conf
  no_log: true

- name: Wait for the API server
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 6443
    state: started
    timeout: 180

- name: Resolve the VM administrator account
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Derive the VM administrator home directory
  ansible.builtin.set_fact:
    vm_administrator_home: "{{ ansible_facts.getent_passwd[ansible_user][4] }}"

- name: Verify the VM administrator home directory
  ansible.builtin.assert:
    that:
      - vm_administrator_home is match('^/')
    fail_msg: Could not resolve an absolute home directory for {{ ansible_user }}.

- name: Create the administrator kubeconfig directory
  ansible.builtin.file:
    path: "{{ vm_administrator_home }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Install kubeconfig for the VM administrator
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ vm_administrator_home }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true

- name: Create the ignored local artifact directory
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../artifacts"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  no_log: true

- name: Fetch the administrator kubeconfig to the operator machine
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ playbook_dir }}/../artifacts/admin.conf"
    flat: true
  no_log: true

- name: Restrict the local kubeconfig permissions
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../artifacts/admin.conf"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
