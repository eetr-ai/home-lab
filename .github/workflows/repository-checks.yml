name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Every check below is defined in Taskfile.yml rather than here, so the
      # command that gates a pull request is the same one you run locally.
      - name: Install go-task
        uses: go-task/setup-task@v2
        with:
          version: 3.53.1

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          # Read from the module so the toolchain CI builds with is the one the
          # module targets, and a bump needs editing in one place.
          go-version-file: admin/api/go.mod
          cache-dependency-path: admin/api/go.sum

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Install Ansible Core
        run: python3 -m pip install ansible-core==2.21.3

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.1.1

      # ShellCheck is preinstalled on ubuntu-latest, so shell:lint needs no setup.
      - name: Run static checks
        run: task lint

      - name: Run repository tests
        run: task test

      # Reads the rendered charts that `task test` produced through
      # tests/validate-*-chart.sh. Kept as a step rather than a task because it
      # runs as a container action.
      - name: Validate rendered Kubernetes resources
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          entrypoint: /kubeconform
          args: >-
            -strict
            -summary
            -skip CustomResourceDefinition
            -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/7b1e26ef9deea49293714d204c1a2270aab1178f/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            -kubernetes-version 1.36.0
            /github/workspace/rendered-platform.yaml
            /github/workspace/rendered-admin.yaml
